# Optional Backstage catalog inputs (copy into blueprint spec.inputs when needed).
#
# app-service-generic: always emits catalog-info.yaml; include owner, system,
# catalog_lifecycle (and description) — no include_backstage_catalog flag.
#
# terraform-module-generic / helm-chart-generic: set include_backstage_catalog
# to "true" and supply owner (required when catalog is enabled).
#
# - name: include_backstage_catalog
#   type: string
#   required: false
#   default: "false"
#   enum: ["true", "false"]
#   description: Emit catalog-info.yaml for Backstage Software Catalog import.
# - name: owner
#   type: string
#   required: false
#   default: ""
#   description: Backstage spec.owner (e.g. group:platform or team:payments).
# - name: system
#   type: string
#   required: false
#   default: ""
#   description: Backstage spec.system (e.g. checkout-platform).
# - name: catalog_lifecycle
#   type: string
#   required: false
#   default: experimental
#   enum: [experimental, production, deprecated]
#   description: Backstage spec.lifecycle for the generated component.
# - name: catalog_depends_on
#   type: string
#   required: false
#   default: ""
#   description: Comma-separated entity refs for spec.dependsOn (catalog graph).
# - name: catalog_provides_apis
#   type: string
#   required: false
#   default: ""
#   description: Comma-separated API refs for spec.providesApis.
# - name: catalog_kubernetes_id
#   type: string
#   required: false
#   default: ""
#   description: backstage.io/kubernetes-id (label on matching workloads).
# - name: catalog_kubernetes_namespace
#   type: string
#   required: false
#   default: ""
#   description: backstage.io/kubernetes-namespace for the Kubernetes tab.
# - name: catalog_consumes_apis
#   type: string
#   required: false
#   default: ""
#   description: Comma-separated API refs for spec.consumesApis.
# - name: catalog_subcomponent_of
#   type: string
#   required: false
#   default: ""
#   description: Parent component ref for spec.subcomponentOf.
# - name: catalog_tags
#   type: string
#   required: false
#   default: ""
#   description: Comma-separated metadata.tags.
# - name: catalog_links
#   type: string
#   required: false
#   default: ""
#   description: Comma-separated Title|https://url (or bare URL) metadata.links.
# - name: catalog_github_slug
#   type: string
#   required: false
#   default: ""
#   description: org/repo for github.com/project-slug and source-location.
# - name: catalog_domain
#   type: string
#   required: false
#   default: ""
#   description: repave.dev/catalog-domain annotation (System.domain hint).
