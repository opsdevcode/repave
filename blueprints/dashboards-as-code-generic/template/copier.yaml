_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - copier.yaml
  - "{% if output_mode != 'terraform' %}versions.tf{% endif %}"
  - "{% if output_mode != 'terraform' %}variables.tf{% endif %}"
  - "{% if output_mode != 'terraform' %}providers.tf{% endif %}"
  - "{% if output_mode != 'terraform' or backend != 'grafana' %}dashboard.tf{% endif %}"
  - "{% if output_mode != 'terraform' or backend != 'datadog' %}datadog_dashboard.tf{% endif %}"
  - "{% if output_mode == 'terraform' and backend == 'grafana' %}grafana/dashboards/service-overview.json{% endif %}"
  - "{% if output_mode == 'terraform' and backend == 'grafana' %}grafana/dashboards/service-golden-signals.json{% endif %}"
  - "{% if output_mode == 'terraform' and backend == 'datadog' %}datadog/dashboards/service-overview.json{% endif %}"
  - "{% if output_mode == 'terraform' and backend == 'datadog' %}datadog/dashboards/service-golden-signals.json{% endif %}"

service_name:
  type: str

organization:
  type: str

team:
  type: str

description:
  type: str

backend:
  type: str
  default: grafana

dashboard_pack_source:
  type: str
  default: repave-red-starter

environment:
  type: str
  default: prod

output_mode:
  type: str
  default: native

observability_focus:
  type: str
  default: dashboards

datasource_uid:
  type: str
  default: prometheus

notification_source:
  type: str
  default: repave-estate-oncall

notification_target:
  type: str
  default: pagerduty-platform-primary

notification_provider:
  type: str
  default: pagerduty

notification_target_label:
  type: str
  default: Platform primary

runbook_url:
  type: str
  default: ""
