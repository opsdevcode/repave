_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - copier.yaml

service_name:
  type: str

organization:
  type: str

team:
  type: str

description:
  type: str

backend:
  type: str
  default: grafana

dashboard_pack_source:
  type: str
  default: repave-red-starter

environment:
  type: str
  default: prod

output_mode:
  type: str
  default: native

observability_focus:
  type: str
  default: dashboards

datasource_uid:
  type: str
  default: prometheus

notification_source:
  type: str
  default: repave-estate-oncall

notification_target:
  type: str
  default: pagerduty-platform-primary

runbook_url:
  type: str
  default: ""
