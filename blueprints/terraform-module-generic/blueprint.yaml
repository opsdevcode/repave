apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: terraform-module-generic
  version: 0.11.0
  description: Generic Terraform module scaffold with provider scope, tests, and CI wiring.
spec:
  standard:
    source: standards/terraform-standards
    version: 1.1.0
  inputs:
    - name: module_name
      type: string
      required: true
      description: Name of the Terraform module (e.g. networking-vnet).
    - name: description
      type: string
      required: true
      description: Short description of what the module does.
    - name: cloud_provider
      type: string
      required: true
      description: Cloud provider this module targets.
      enum:
        - aws
        - azure
        - gcp
      default: aws
    - name: provider_services
      type: string
      required: true
      description: Comma-separated Terraform provider services in scope (from provider-catalog.json).
    - name: provider_service_scope
      type: string
      required: false
      description: JSON map of service scope — basic capabilities with optional additional resources, or custom-only.
    - name: policy_pack_source
      type: string
      required: false
      default: repave-default
      enum:
        - repave-default
    - name: policy_profile
      type: string
      required: false
      default: estate-default
      enum:
        - estate-default
        - strict
        - custom
    - name: policy_rules
      type: string
      required: false
      multi: true
      default: ""
      description: Rule IDs from policy/catalog.json when policy_profile is custom.
  template:
    engine: copier
    path: template
  gates:
    - terraform-fmt
    - terraform-validate
    - tflint
    - checkov
    - secrets
    - opa
    - docs-drift
    - provenance-drift
  checkov:
    policies_source: policy/checkov/policies
    policy_version: 1.2.0
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.0.0
  gate_config:
    checkov:
      external_checks_dir: policy/checkov
      config_file: .checkov.yml
    opa:
      policies_dir: policy/opa/policies
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "tf-{cloud_provider}-{module_name}"
      title_template: "Bootstrap {cloud_provider} module {module_name} ({provider_services})"
