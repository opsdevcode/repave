apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: terraform-module-generic
  version: 0.12.0
  description: Generic Terraform module scaffold with provider scope, tests, and CI wiring.
spec:
  standard:
    source: standards/terraform-standards
    version: 1.1.0
  inputs:
    - name: module_name
      type: string
      required: true
      description: Name of the Terraform module (e.g. networking-vnet).
      guided_from: "{provider_services}"
    - name: description
      type: string
      required: true
      description: Short description of what the module does.
      guided_from: "{cloud_provider} Terraform module covering {provider_services}."
    - name: cloud_provider
      type: string
      required: true
      description: Cloud provider this module targets.
      enum:
        - aws
        - azure
        - gcp
      default: aws
    - name: provider_services
      type: string
      required: true
      description: Comma-separated Terraform provider services in scope (from provider-catalog.json).
    - name: provider_service_scope
      type: string
      required: false
      advanced: true
      description: JSON map of service scope — basic capabilities with optional additional resources, or custom-only.
    - name: policy_pack_source
      type: string
      required: false
      advanced: true
      default: repave-default
      description: Pack registry entry from policy/catalog.json pack_sources.
    - name: policy_profile
      type: string
      required: false
      advanced: true
      default: estate-default
      description: Profile from policy/catalog.json (use custom with policy_rules).
    - name: policy_rules
      type: string
      required: false
      advanced: true
      multi: true
      default: ""
      description: Rule IDs from policy/catalog.json when policy_profile is custom.
    - name: include_backstage_catalog
      type: string
      required: false
      advanced: true
      default: "false"
      enum:
        - "true"
        - "false"
      description: Emit catalog-info.yaml for Backstage Software Catalog import.
    - name: owner
      type: string
      required: true
      default: platform-engineering
      description: Owning team for cost allocation and Backstage catalog owner.
    - name: cost_center
      type: string
      required: false
      advanced: true
      default: ""
      description: Optional cost center for chargeback (CostCenter tag).
    - name: system
      type: string
      required: false
      advanced: true
      default: ""
      description: Backstage spec.system (optional platform system name).
    - name: catalog_lifecycle
      type: string
      required: false
      advanced: true
      default: experimental
      enum:
        - experimental
        - production
        - deprecated
      description: Backstage spec.lifecycle for the generated component.
  template:
    engine: copier
    path: template
  gates:
    - terraform-fmt
    - terraform-validate
    - terraform-test
    - tflint
    - checkov
    - infracost
    - secrets
    - opa
    - docs-drift
    - provenance-drift
  checkov:
    policies_source: policy/checkov/policies
    policy_version: 1.2.0
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.0.0
  gate_config:
    checkov:
      external_checks_dir: policy/checkov
      config_file: .checkov.yml
    opa:
      policies_dir: policy/opa/policies
      fixtures_dir: policy/opa/fixtures
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "tf-{cloud_provider}-{module_name}"
      title_template: "Bootstrap {cloud_provider} module {module_name} ({provider_services})"
