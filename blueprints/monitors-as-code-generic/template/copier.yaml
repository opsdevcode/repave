_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - copier.yaml
  - "{% if output_mode != 'terraform' %}versions.tf{% endif %}"
  - "{% if output_mode != 'terraform' %}variables.tf{% endif %}"
  - "{% if output_mode != 'terraform' %}providers.tf{% endif %}"
  - "{% if output_mode != 'terraform' or backend != 'datadog' %}monitors.tf{% endif %}"
  - "{% if output_mode != 'terraform' or backend != 'prometheus' %}prometheus_rules.tf{% endif %}"
  - "{% if output_mode != 'terraform' or backend != 'prometheus' %}alertmanager.tf{% endif %}"
  - "{% if output_mode == 'terraform' %}datadog/monitors/service-alerts.json{% endif %}"
  - "{% if output_mode == 'terraform' %}prometheus/rules/service-alerts.yaml{% endif %}"
  - "{% if output_mode == 'terraform' %}prometheus/alertmanager/alertmanager.yaml{% endif %}"

service_name:
  type: str

organization:
  type: str

team:
  type: str

description:
  type: str

backend:
  type: str
  default: datadog

environment:
  type: str
  default: prod

output_mode:
  type: str
  default: native

notification_source:
  type: str
  default: repave-estate-oncall

notification_target:
  type: str
  default: pagerduty-platform-primary

notification_provider:
  type: str
  default: pagerduty

notification_target_label:
  type: str
  default: Platform primary

runbook_url:
  type: str

slo_target_percent:
  type: str
  default: ""
