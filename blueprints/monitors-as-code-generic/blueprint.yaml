apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: monitors-as-code-generic
  version: 0.2.0
  description: Governed Datadog monitors and Prometheus alerting (native or Terraform).
spec:
  artifactType: observability
  standard:
    source: standards/observability/monitors-as-code.md
    version: 1.0.0
  inputs:
    - name: service_name
      type: string
      required: true
      description: Logical service name (labels, repo name, scrape job).
    - name: configuration_mode
      type: string
      required: false
      default: recommended
      enum:
        - recommended
        - custom
      description: recommended applies catalog defaults after you pick service and backend; custom exposes all fields.
    - name: organization
      type: string
      required: true
      description: Owning organization or business unit slug.
    - name: team
      type: string
      required: true
      description: Team slug for alert labels and monitor tags.
    - name: description
      type: string
      required: true
      description: What this monitor repo covers.
    - name: backend
      type: string
      required: false
      default: datadog
      enum:
        - datadog
        - prometheus
      description: Monitor platform (Datadog JSON or Prometheus rules + Alertmanager stub).
    - name: monitor_pack_source
      type: string
      required: false
      default: repave-red-starter
      description: Community monitor pack from observability/catalog.json (see observability/monitors/).
    - name: output_mode
      type: string
      required: false
      default: native
      enum:
        - native
        - terraform
      description: native emits backend-native files; terraform emits provider resources at repo root.
    - name: environment
      type: string
      required: false
      default: prod
      description: Environment slug for tags and metadata.
    - name: observability_focus
      type: string
      required: false
      default: monitors
      enum:
        - monitors
      description: Provenance focus for upgrade plans (monitors vs dashboards paths).
    - name: notification_source
      type: string
      required: false
      default: repave-estate-oncall
      description: Catalog source for notification targets (see observability/catalog.json).
    - name: notification_target
      type: string
      required: false
      default: pagerduty-platform-primary
      description: Target from the selected notification source.
    - name: runbook_url
      type: string
      required: true
      description: HTTPS runbook base URL used in alert annotations.
    - name: slo_target_percent
      type: string
      required: false
      default: ""
      description: Optional availability SLO target (e.g. 99.9) for starter SLO rules (Prometheus).
    - name: policy_pack_source
      type: string
      required: false
      default: repave-observability-pack
      description: Pack registry entry from policy/catalog.json pack_sources.
    - name: policy_profile
      type: string
      required: false
      default: observability-default
      description: Profile from policy/catalog.json (use custom with policy_rules).
    - name: policy_rules
      type: string
      required: false
      multi: true
      default: ""
      description: Rule IDs from policy/catalog.json when policy_profile is custom.
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - promtool
    - amtool
    - datadog-monitor
    - datadog-api-validate
    - terraform-fmt
    - terraform-validate
    - opa
    - secrets
    - docs-drift
    - provenance-drift
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.1.0
  gate_config:
    promtool:
      rules_glob: prometheus/rules/*.y*ml
    amtool:
      config_glob: prometheus/alertmanager/*.y*ml
    datadog-monitor:
      monitors_glob: datadog/monitors/*.json
    opa:
      policies_dir: policy/opa/policies
      native_globs:
        - datadog/monitors/*.json
        - prometheus/rules/*.y*ml
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "monitors-{organization}-{service_name}"
      title_template: "Bootstrap monitors for {service_name} ({organization})"
