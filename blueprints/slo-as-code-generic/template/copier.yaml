_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - copier.yaml

service_name:
  type: str

organization:
  type: str

team:
  type: str

description:
  type: str

slo_target_percent:
  type: str

runbook_url:
  type: str

