apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: slo-as-code-generic
  version: 0.1.0
  description: Governed Prometheus SLO recording rules and multi-window burn-rate alerts.
spec:
  artifactType: observability
  standard:
    source: standards/observability/slos-as-code.md
    version: 1.0.0
  inputs:
    - name: service_name
      type: string
      required: true
      description: Logical service name (recording rule prefix and repo name).
    - name: organization
      type: string
      required: true
      description: Owning organization or business unit slug.
    - name: team
      type: string
      required: true
      description: Team slug for alert labels.
    - name: description
      type: string
      required: true
      description: What this SLO repository covers.
    - name: slo_target_percent
      type: string
      required: true
      description: Availability SLO target (for example 99.9).
    - name: runbook_url
      type: string
      required: true
      description: HTTPS runbook URL used in alert annotations (repo RUNBOOK.md or wiki).
    - name: environment
      type: string
      required: false
      default: prod
      description: Environment slug for labels.
    - name: observability_focus
      type: string
      required: false
      default: slo
      enum:
        - slo
      description: Provenance focus for upgrade plans (SLO vs monitors paths).
    - name: notification_source
      type: string
      required: false
      default: repave-estate-oncall
      description: Catalog source for notification targets.
    - name: notification_target
      type: string
      required: false
      default: pagerduty-platform-primary
      description: Target from the selected notification source.
    - name: enable_policy
      type: string
      required: false
      default: "false"
      enum:
        - "true"
        - "false"
      description: When true, vend observability OPA pack and run opa gate.
    - name: policy_pack_source
      type: string
      required: false
      default: repave-observability-pack
      description: Pack registry entry from policy/catalog.json pack_sources.
    - name: policy_profile
      type: string
      required: false
      default: observability-default
      description: Profile from policy/catalog.json.
    - name: policy_rules
      type: string
      required: false
      multi: true
      default: ""
      description: Rule IDs when policy_profile is custom.
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - promtool
    - opa
    - secrets
    - docs-drift
    - provenance-drift
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.1.0
  gate_config:
    promtool:
      rules_glob: prometheus/rules/*.y*ml
    opa:
      policies_dir: policy/opa/policies
      native_globs:
        - prometheus/rules/*.y*ml
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "slo-{organization}-{service_name}"
      title_template: "Bootstrap SLO rules for {service_name} ({organization})"
