apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: app-service-generic
  version: 0.4.2
  description: Governed application service repo (Python, Go, or Node.js/TypeScript) with Dockerfile, tests, and Backstage catalog metadata.
spec:
  artifactType: app-service
  standard:
    source: standards/app/service-standard.md
    version: 1.0.0
  inputs:
    - name: service_name
      type: string
      required: true
      description: Service name (repository app-{service_name}, Backstage component id).
    - name: description
      type: string
      required: true
      description: Short description for README and catalog-info.yaml.
    - name: owner
      type: string
      required: true
      description: Owning team or group (Backstage `spec.owner`, e.g. group:platform).
    - name: system
      type: string
      required: false
      default: ""
      description: Backstage `spec.system` (platform or product system name).
    - name: catalog_lifecycle
      type: string
      required: false
      default: experimental
      enum:
        - experimental
        - production
        - deprecated
      description: Backstage `spec.lifecycle` for the generated component.
    - name: port
      type: string
      required: false
      default: "8080"
      description: Container listen port exposed in the Dockerfile and health checks.
    - name: runtime
      type: string
      required: false
      default: python
      enum:
        - python
        - go
        - nodejs
      description: Application runtime (Python FastAPI, Go HTTP, or Node.js/TypeScript HTTP).
    - name: include_helm_reference
      type: string
      required: false
      default: "false"
      enum:
        - "true"
        - "false"
      description: When true, README documents deploying via a sibling helm-{service_name} chart.
    - name: helm_chart_repo
      type: string
      required: false
      default: ""
      description: Optional Git URL for the Helm chart repo (required when include_helm_reference is true).
    - name: enable_deploy_pipeline
      type: string
      required: false
      default: "false"
      enum:
        - "true"
        - "false"
      description: Emit repave-deploy workflow and OIDC trust docs for container build/push.
    - name: deploy_environment
      type: string
      required: false
      default: dev
      enum:
        - dev
        - staging
        - prod
      description: GitHub Environment name gating registry push (when deploy pipeline enabled).
    - name: container_registry
      type: string
      required: false
      default: ""
      description: Container registry host/path prefix (for example ghcr.io/acme). Required when deploy pipeline is enabled.
  template:
    engine: copier
    path: template
  gates:
    - dockerfile-lint
    - python-lint
    - python-test
    - go-lint
    - go-test
    - node-lint
    - node-test
    - actionlint
    - secrets
    - docs-drift
    - provenance-drift
  gate_config:
    dockerfile-lint:
      dockerfile: Dockerfile
    python-lint:
      config_file: pyproject.toml
    python-test:
      test_directory: tests
    node-lint:
      config_file: package.json
    node-test:
      test_directory: test
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "app-{service_name}"
      title_template: "Bootstrap application service {service_name}"
