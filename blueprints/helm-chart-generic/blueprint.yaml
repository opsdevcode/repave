apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: helm-chart-generic
  version: 0.3.1
  description: Governed Helm chart for Kubernetes workloads (Deployment, Service, optional Ingress).
spec:
  artifactType: helm-chart
  standard:
    source: standards/helm/chart-standard.md
    version: 1.0.0
  inputs:
    - name: chart_name
      type: string
      required: true
      description: Helm chart name (Chart.yaml name; repo helm-{chart_name}).
      guided_from: "{image_repository}"
    - name: app_name
      type: string
      required: true
      description: Application label and container name.
      guided_from: "{image_repository}"
    - name: description
      type: string
      required: true
      description: Chart description (Chart.yaml and README).
      guided_from: "Helm chart for {image_repository} ({service_type}, {environment})."
    - name: image_repository
      type: string
      required: true
      description: Container image repository (without tag).
    - name: image_tag
      type: string
      required: false
      default: "1.0.0"
      description: Container image tag.
    - name: service_type
      type: string
      required: false
      default: ClusterIP
      enum:
        - ClusterIP
        - NodePort
        - LoadBalancer
      description: Kubernetes Service type.
    - name: service_port
      type: string
      required: false
      default: "8080"
      description: Service port exposed by the chart.
    - name: enable_ingress
      type: string
      required: false
      default: "false"
      enum:
        - "true"
        - "false"
      description: Emit an Ingress template when true.
    - name: ingress_host
      type: string
      required: false
      default: ""
      description: Ingress hostname (required when enable_ingress is true).
    - name: environment
      type: string
      required: false
      default: dev
      enum:
        - dev
        - staging
        - prod
      description: Deployment environment for FinOps labels (repave.dev/environment).
    - name: cost_center
      type: string
      required: false
      advanced: true
      default: ""
      description: Optional cost center for chargeback metadata.
    - name: include_backstage_catalog
      type: string
      required: false
      advanced: true
      default: "false"
      enum:
        - "true"
        - "false"
      description: Emit catalog-info.yaml for Backstage Software Catalog import.
    - name: owner
      type: string
      required: true
      default: platform-engineering
      description: Owning team for FinOps labels and Backstage catalog owner.
    - name: system
      type: string
      required: false
      advanced: true
      default: ""
      description: Backstage spec.system (optional platform system name).
    - name: catalog_lifecycle
      type: string
      required: false
      advanced: true
      default: experimental
      enum:
        - experimental
        - production
        - deprecated
      description: Backstage spec.lifecycle for the generated component.
    - name: catalog_depends_on
      type: string
      required: false
      advanced: true
      default: ""
      description: Comma-separated Backstage entity refs for spec.dependsOn.
    - name: catalog_provides_apis
      type: string
      required: false
      advanced: true
      default: ""
      description: Comma-separated Backstage API refs for spec.providesApis.
    - name: enable_deploy_pipeline
      type: string
      required: false
      advanced: true
      default: "false"
      enum:
        - "true"
        - "false"
      description: Emit repave-deploy workflow to open GitOps promotion PRs (no helm upgrade in CI).
    - name: deploy_environment
      type: string
      required: false
      advanced: true
      default: dev
      enum:
        - dev
        - staging
        - prod
      description: GitHub Environment protecting GitOps promotion (when deploy pipeline enabled).
    - name: gitops_repo
      type: string
      required: false
      advanced: true
      default: ""
      description: GitOps repository (org/name) receiving chart version bumps. Required when deploy pipeline is enabled.
    - name: gitops_manifest_path
      type: string
      required: false
      advanced: true
      default: apps/release.yaml
      description: Path to the Argo CD Application or Flux HelmRelease manifest in the GitOps repo.
    - name: gitops_engine
      type: string
      required: false
      advanced: true
      default: argocd
      enum:
        - argocd
        - flux
      description: GitOps controller reconciling the target manifest.
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - helm-lint
    - helm-template
    - opa
    - actionlint
    - secrets
    - docs-drift
    - provenance-drift
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.0.0
  gate_config:
    yamllint:
      paths:
        - Chart.yaml
        - values.yaml
    helm-lint:
      chart_path: "."
    helm-template:
      chart_path: "."
      release_name: repave-test
    opa:
      policies_dir: policy/opa/policies
      helm_release_name: repave-test
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "helm-{chart_name}"
      title_template: "Bootstrap Helm chart {chart_name}"
