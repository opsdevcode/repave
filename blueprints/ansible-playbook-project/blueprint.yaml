apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: ansible-playbook-project
  version: 0.2.0
  description: Ansible playbook project with inventory layout, patterns, and pinned requirements.
spec:
  artifactType: ansible-playbook-project
  standard:
    source: standards/ansible/playbook-project-standard.md
    version: 1.2.0
  inputs:
    - name: project_name
      type: string
      required: true
      description: Short project name (used in repo name and play labels).
    - name: description
      type: string
      required: true
      description: What this playbook project automates.
    - name: playbook_pattern_source
      type: string
      required: false
      default: ""
      description: >-
        Playbook pattern from ansible/catalog.json; when empty, defaults to linux-patch-baseline or
        windows-update-baseline from platform selection.
    - name: support_linux
      type: string
      required: false
      default: "true"
      description: Include Linux-oriented playbook patterns and inventory groups.
    - name: support_windows
      type: string
      required: false
      default: "false"
      description: Include Windows-oriented playbook patterns and inventory groups.
    - name: min_ansible_version
      type: string
      required: true
      description: Minimum supported Ansible core version.
      default: "2.18"
      enum:
        - "2.18"
        - "2.17"
        - "2.16"
        - "2.15"
    - name: environment
      type: string
      required: true
      description: Primary inventory environment scaffolded under inventories/.
      enum:
        - dev
        - staging
        - prod
      default: dev
    - name: pinned_roles
      type: string
      required: false
      description: JSON array of pinned Galaxy roles (portal role inventory picker).
      default: "[]"
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - ansible-lint
    - ansible-syntax-check
    - secrets
    - docs-drift
    - provenance-drift
  ansible_lint:
    pack_source: policy/ansible-lint/pack
    pack_version: 1.0.0
  gate_config:
    ansible-lint:
      config_file: .ansible-lint
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "ansible-playbook-{project_name}"
      title_template: "Bootstrap Ansible playbook project {project_name}"
