apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: opa-policy-generic
  version: 0.2.0
  description: Standalone Conftest/OPA Rego policy artifact with fixture tests.
spec:
  artifactType: opa-policy
  standard:
    source: standards/policy/opa.md
    version: 1.0.0
  inputs:
    - name: policy_name
      type: string
      required: true
      description: Short name for this OPA policy set (used in repo name).
    - name: organization
      type: string
      required: true
      description: Owning team or organization slug.
    - name: description
      type: string
      required: true
      description: What this policy set enforces.
    - name: policy_pack_source
      type: string
      required: false
      default: repave-default
      enum:
        - repave-default
    - name: policy_profile
      type: string
      required: false
      default: estate-default
      enum:
        - estate-default
        - strict
        - custom
    - name: policy_rules
      type: string
      required: false
      multi: true
      default: ""
      description: Rule IDs from policy/catalog.json when policy_profile is custom.
  template:
    engine: copier
    path: template
  gates:
    - opa
    - secrets
    - docs-drift
    - provenance-drift
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.0.0
  gate_config:
    opa:
      policies_dir: policy
      fixtures_dir: tests/fixtures
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "opa-policy-{organization}-{policy_name}"
      title_template: "Bootstrap OPA policy {policy_name} for {organization}"
