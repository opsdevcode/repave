apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: github-repo-generic
  version: 0.2.0
  description: >-
    Provision a GitHub organization repository from a template or selection form,
    optionally apply a ruleset profile, sync team membership from a source org team,
    then grant selected org teams repository permission.
spec:
  artifactType: github-repo
  standard:
    source: standards/github/repo-provisioning-standard.md
    version: 1.1.0
  inputs:
    - name: repo_name
      type: string
      required: true
      description: Repository name (https://github.com/{org}/{repo_name}).
    - name: description
      type: string
      required: false
      default: ""
      description: Short repository description shown on GitHub.
      guided_from: "{visibility} GitHub repository ({create_mode})."
    - name: create_mode
      type: string
      required: true
      default: selection
      enum:
        - selection
        - template
      description: >-
        selection creates a repo from visibility/topics choices; template copies an
        org template repository.
    - name: visibility
      type: string
      required: true
      default: private
      enum:
        - private
        - public
        - internal
      description: Repository visibility (internal requires GitHub Enterprise Cloud).
    - name: topics
      type: string
      required: false
      default: ""
      description: Comma-separated GitHub topics (optional).
    - name: template_owner
      type: string
      required: false
      default: ""
      description: Owner of the template repository (required when create_mode is template).
    - name: template_repo
      type: string
      required: false
      default: ""
      description: Template repository name (required when create_mode is template).
    - name: team_slugs
      type: string
      required: false
      default: ""
      description: >-
        Comma-separated destination org team slugs (portal lists org teams to pick).
        Created if missing when membership sync is enabled; then granted
        team_permission on the new repo.
    - name: team_permission
      type: string
      required: false
      default: push
      enum:
        - pull
        - triage
        - push
        - maintain
        - admin
      description: Permission granted to every selected team.
    - name: sync_team_membership
      type: string
      required: false
      default: ""
      description: >-
        When true (or when membership_source_team is set and this is left empty),
        create missing destination teams and add source members (additive only).
    - name: membership_source_team
      type: string
      required: false
      default: ""
      description: >-
        Existing org team slug whose members are copied additively into team_slugs
        (required when sync_team_membership is true and team_slugs is set).
        Portal lists org teams; the source team must already exist.
    - name: ruleset_profile
      type: string
      required: false
      default: none
      enum:
        - none
        - default-pr
      description: >-
        Repository ruleset applied after overlay push. default-pr requires PRs and
        blocks force-push on the default branch (no required status checks).
    - name: default_branch
      type: string
      required: false
      default: main
      description: Default branch name for the overlay commit push.
  template:
    engine: copier
    path: template
  gates:
    - secrets
    - docs-drift
    - provenance-drift
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "{repo_name}"
      title_template: "Provision GitHub repository {repo_name}"
