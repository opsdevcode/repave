apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: ansible-role-generic
  version: 0.3.0
  description: Galaxy-compatible Ansible role scaffold with production-profile lint pack.
spec:
  artifactType: ansible-role
  standard:
    source: standards/ansible
    version: 1.0.0
  inputs:
    - name: role_name
      type: string
      required: true
      description: Name of the Ansible role (e.g. webserver).
    - name: namespace
      type: string
      required: true
      description: Galaxy namespace for the role (e.g. acme).
    - name: description
      type: string
      required: true
      description: Short description of what the role does.
    - name: min_ansible_version
      type: string
      required: true
      description: Minimum supported Ansible core version (matches Molecule test image tag).
      default: "2.18"
      enum:
        - "2.18"
        - "2.17"
        - "2.16"
        - "2.15"
    - name: support_linux
      type: string
      required: false
      description: Include estate Linux Galaxy platforms (EL, Ubuntu LTS, Debian).
      default: "true"
      enum:
        - "true"
        - "false"
    - name: support_windows
      type: string
      required: false
      description: Include a Windows Server Galaxy platform.
      default: "false"
      enum:
        - "true"
        - "false"
    - name: windows_server_generation
      type: string
      required: false
      description: Windows Server generation when support_windows is true.
      default: "2022"
      enum:
        - "2022"
        - "2019"
    - name: target_platforms_advanced
      type: string
      required: false
      multi: true
      description: Optional advanced Galaxy platform list (overrides Linux/Windows presets).
      default: ""
      enum:
        - "EL:9"
        - "EL:8"
        - "Ubuntu:noble"
        - "Ubuntu:jammy"
        - "Ubuntu:focal"
        - "Debian:bookworm"
        - "Debian:bullseye"
        - "Windows:2022"
        - "Windows:2019"
        - "Windows:2016"
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - ansible-lint
    - ansible-syntax-check
    - secrets
    - molecule
    - docs-drift
    - provenance-drift
  ansible_lint:
    pack_source: policy/ansible-lint/pack
    pack_version: 1.0.0
  gate_config:
    ansible-lint:
      config_file: .ansible-lint
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "ansible-role-{role_name}"
      title_template: "Bootstrap Ansible role {namespace}.{role_name}"
