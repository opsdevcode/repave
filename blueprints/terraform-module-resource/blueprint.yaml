apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: terraform-module-resource
  version: 0.5.0
  description: Thin Terraform module for a single in-scope cloud resource (tfm-* repos).
spec:
  artifactType: terraform-module
  terraformModule:
    layout: single-resource
  standard:
    source: standards/terraform-standards
    version: 1.1.0
  inputs:
    - name: module_name
      type: string
      required: true
      description: Name of the Terraform module (e.g. acme-bucket).
    - name: description
      type: string
      required: true
      description: Short description of what the module manages.
    - name: cloud_provider
      type: string
      required: true
      description: Cloud provider this module targets.
      enum:
        - aws
        - azure
        - gcp
      default: aws
    - name: provider_service
      type: string
      required: true
      description: Terraform provider service (from provider-catalog.json).
    - name: provider_resource
      type: string
      required: true
      description: Single resource type within the service to scaffold.
    - name: owner
      type: string
      required: true
      default: platform-engineering
      description: Owning team for cost allocation (Owner tag).
    - name: cost_center
      type: string
      required: false
      default: ""
      description: Optional cost center for chargeback (CostCenter tag).
    - name: policy_pack_source
      type: string
      required: false
      default: repave-default
      description: Pack registry entry from policy/catalog.json pack_sources.
    - name: policy_profile
      type: string
      required: false
      default: estate-default
      description: Profile from policy/catalog.json (use custom with policy_rules).
    - name: policy_rules
      type: string
      required: false
      multi: true
      default: ""
      description: Rule IDs from policy/catalog.json when policy_profile is custom.
  template:
    engine: copier
    path: template
  gates:
    - terraform-fmt
    - terraform-validate
    - terraform-test
    - tflint
    - checkov
    - secrets
    - opa
    - docs-drift
    - provenance-drift
  checkov:
    policies_source: policy/checkov/policies
    policy_version: 1.2.0
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.0.0
  gate_config:
    checkov:
      external_checks_dir: policy/checkov
      config_file: .checkov.yml
    opa:
      policies_dir: policy/opa/policies
      fixtures_dir: policy/opa/fixtures
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "tfm-{cloud_provider}-{provider_service}-{module_name}"
      title_template: "Bootstrap {cloud_provider} {provider_service}/{provider_resource} module {module_name}"
