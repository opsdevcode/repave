apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: observability-as-code-generic
  version: 0.4.0
  description: Governed alerts and monitors across Prometheus, Grafana, Datadog, OTel, and Terraform.
spec:
  artifactType: observability
  standard:
    source: standards/observability/observability-as-code.md
    version: 1.2.0
  inputs:
    - name: service_name
      type: string
      required: true
      description: Logical service name (labels, repo name, scrape job).
    - name: configuration_mode
      type: string
      required: false
      default: recommended
      enum:
        - recommended
        - custom
      description: recommended applies catalog defaults after you pick service and backend; custom exposes all fields.
    - name: organization
      type: string
      required: true
      description: Owning organization or business unit slug.
    - name: team
      type: string
      required: true
      description: Team slug for alert labels and dashboard tags.
    - name: description
      type: string
      required: true
      description: What this observability repo covers.
    - name: backend
      type: string
      required: false
      default: prometheus
      enum:
        - prometheus
        - grafana
        - datadog
        - otel
      description: Observability backend; terraform mode supports datadog, grafana, prometheus, or otel.
    - name: output_mode
      type: string
      required: false
      default: native
      enum:
        - native
        - terraform
      description: native emits backend-native YAML/JSON; terraform emits provider resources at repo root.
    - name: environment
      type: string
      required: false
      default: prod
      description: Environment slug for dashboard tags and metadata (for example prod).
    - name: notification_source
      type: string
      required: false
      default: repave-estate-oncall
      description: Catalog source for notification targets (see observability/catalog.json).
    - name: notification_target
      type: string
      required: false
      default: pagerduty-platform-primary
      description: Target from the selected notification source (PagerDuty service, Slack channel, etc.).
    - name: runbook_url
      type: string
      required: true
      description: HTTPS runbook base URL used in alert annotations.
    - name: slo_target_percent
      type: string
      required: false
      default: ""
      description: Optional availability SLO target (e.g. 99.9) for starter SLO rules.
  template:
    engine: copier
    path: template
  gates:
    - yamllint
    - promtool
    - amtool
    - grafana-dashboard
    - datadog-monitor
    - datadog-api-validate
    - terraform-fmt
    - terraform-validate
    - opa
    - secrets
    - docs-drift
    - provenance-drift
  opa:
    policies_source: policy/opa/policies
    policy_version: 1.1.0
  gate_config:
    promtool:
      rules_glob: prometheus/rules/*.y*ml
    amtool:
      config_glob: prometheus/alertmanager/*.y*ml
    grafana-dashboard:
      dashboards_glob: grafana/dashboards/*.json
    datadog-monitor:
      monitors_glob: datadog/monitors/*.json
    opa:
      policies_dir: policy/opa/policies
      native_globs:
        - datadog/monitors/*.json
        - grafana/dashboards/*.json
        - prometheus/rules/*.y*ml
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "observability-{organization}-{service_name}"
      title_template: "Bootstrap observability for {service_name} ({organization})"
