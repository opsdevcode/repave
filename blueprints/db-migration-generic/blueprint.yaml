apiVersion: repave.dev/v1alpha1
kind: Blueprint
metadata:
  name: db-migration-generic
  version: 0.1.0
  description: Alembic, Flyway, or Atlas migration repo with destructive-DDL policy and rollback pairing.
spec:
  artifactType: db-migration
  standard:
    source: standards/db/migration-standard.md
    version: 1.0.0
  inputs:
    - name: service_name
      type: string
      required: true
      description: Service whose schema this repo migrates (used in the repo name).
    - name: organization
      type: string
      required: true
      description: Owning team or organization slug.
    - name: description
      type: string
      required: true
      description: What this migration repo manages.
      guided_from: "{organization} {tool} migrations for {service_name}."
    - name: tool
      type: string
      required: false
      default: alembic
      enum:
        - alembic
        - flyway
        - atlas
      description: Migration runner layout (Alembic, Flyway, or Atlas).
  template:
    engine: copier
    path: template
  gates:
    - migration-policy
    - migration-rollback
    - secrets
    - docs-drift
    - provenance-drift
  gate_config:
    migration-policy:
      waivers_file: waivers/destructive.yaml
    migration-rollback: {}
  output:
    type: pull_request
    provenance:
      file: repave.yaml
    repository:
      name_template: "db-migration-{organization}-{service_name}"
      title_template: "Bootstrap {tool} migrations for {service_name}"
