---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-domain
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: demo
  title: Demo
  description: Example domain for local yarn start and chart-smoke Catalog.
spec:
  owner: group:default/platform
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
  domain: demo
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
  tags:
    - demo
    - website
  links:
    - url: https://example.com
      title: Example site
  annotations:
    backstage.io/kubernetes-id: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  dependsOn:
    - component:default/tf-aws-demo
  providesApis: [example-grpc-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-worker
  title: example-worker
  description: Child worker that consumes the example gRPC API.
  tags:
    - demo
    - worker
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
  subcomponentOf: component:default/example-website
  consumesApis: [example-grpc-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tf-aws-demo
  title: tf-aws-demo
  tags:
    - terraform
    - aws
  annotations:
    repave.dev/blueprint: terraform-module-generic
    repave.dev/blueprint-version: 1.0.0
    repave.dev/standard-source: standards/terraform
    repave.dev/standard-version: 1.0.0
    repave.dev/engine-version: 3.6.0
    repave.dev/artifact-type: terraform-module
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: opsdevcode/tf-aws-demo
    backstage.io/source-location: url:https://github.com/opsdevcode/tf-aws-demo
spec:
  type: library
  lifecycle: production
  owner: group:default/platform
  system: examples
  dependsOn:
    - resource:default/tf-aws-demo-state
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: tf-aws-demo-state
  title: tf-aws-demo state
  description: Example remote state the tf-aws-demo module depends on.
spec:
  type: s3-bucket
  owner: group:default/platform
  system: examples
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
