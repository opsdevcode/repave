---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests, platform]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
  title: Guests
  description: Local guest identities for yarn start and chart-smoke.
spec:
  type: team
  children: []
  members: [guest]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  title: Platform
  description: Owns generated Terraform, Helm, and app-service golden paths.
spec:
  type: team
  children: []
  members: [guest]
