app:
  # Hosted same-host Catalog is https://<host>/idp (chart sets APP_BASE_URL).
  # Do not iframe /idp into the HTML workbench.
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # SQLite so chart-smoke / default-off hosted installs do not need Postgres.
  # Backstage 1.53+ rejects a single connection.filename for the base client.
  # Override with a third --config file (client: pg) when you run a real DB.
  database:
    client: better-sqlite3
    connection:
      directory: /tmp/backstage-db

# Guest only. Auth0 is a third --config (app-config.auth0.yaml) when
# AUTH0_CLIENT_ID is set — empty ${AUTH0_*:-} still fails provider init.
auth:
  providers:
    guest: {}

repave:
  apiBaseUrl: ${REPAVE_API_BASE_URL:-}
  apiToken: ${REPAVE_API_TOKEN:-}
  portalBaseUrl: ${REPAVE_PORTAL_BASE_URL:-/}
  logoUrl: ${REPAVE_PORTAL_LOGO_URL:-}
  accentColor: ${REPAVE_PORTAL_ACCENT_COLOR:-}

proxy:
  endpoints:
    '/repave':
      target: ${REPAVE_API_BASE_URL:-http://127.0.0.1:8088}
      changeOrigin: true
      headers:
        Authorization: Bearer ${REPAVE_API_TOKEN:-}

# Hosted image installs mkdocs-techdocs-core (see packages/backend/Dockerfile).
# Do not use runIn: docker here — the pod has no Docker socket.
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: in-cluster
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipMetricsLookup: true

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    - type: file
      target: ./examples/templates/terraform-module-generic.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/templates/helm-chart-generic.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/templates/app-service-generic.yaml
      rules:
        - allow: [Template]

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
