run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/opsdevcode/repave/operator
  gosec:
    excludes:
      - G115  # int→int32 status fields are bounded at call sites

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go$
      linters:
        - gosec
