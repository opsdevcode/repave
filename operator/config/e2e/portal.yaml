apiVersion: v1
kind: Service
metadata:
  name: repave-portal
  namespace: repave-system
spec:
  selector:
    app: repave-portal
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repave-portal
  namespace: repave-system
  labels:
    app: repave-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repave-portal
  template:
    metadata:
      labels:
        app: repave-portal
    spec:
      containers:
        - name: portal
          image: repave-portal:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: REPAVE_GITHUB_ORG
              value: example-org
            - name: REPAVE_MODULES_ROOT
              value: /modules
          volumeMounts:
            - name: modules
              mountPath: /modules
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: modules
          hostPath:
            path: /modules
            type: Directory
