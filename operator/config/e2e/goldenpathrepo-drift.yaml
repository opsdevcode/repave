apiVersion: repave.dev/v1alpha1
kind: GoldenPathRepo
metadata:
  name: e2e-drift
  namespace: default
spec:
  # Mounted into the kind node and operator pod from operator/testdata/modules.
  localPath: /modules/terraform-minimal
  desiredPins:
    blueprintName: terraform-module-generic
    # Fixture repave.yaml pins 0.9.0 — force OutOfDate.
    blueprintVersion: "9.9.9"
    standardSource: standards/terraform-standards
    standardVersion: "1.1.0"
  remediation:
    # Plan-only on kind: /modules is read-only on the node mount.
    enabled: false
    dryRun: true
    preserveLocal: true
