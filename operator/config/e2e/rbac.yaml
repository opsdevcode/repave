apiVersion: v1
kind: ServiceAccount
metadata:
  name: repave-operator
  namespace: repave-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: repave-operator
rules:
  - apiGroups: ["repave.dev"]
    resources: ["blueprints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: repave-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: repave-operator
subjects:
  - kind: ServiceAccount
    name: repave-operator
    namespace: repave-system
