# Example: PostgreSQL-backed queue with external worker Deployment and corpus OCI mount
# (service decomposition Phase 2). Async run previews rehydrate from Postgres snapshots;
# object storage is optional — see artifactStoreUri below.
#
#   helm install -f values.yaml -f values-decomposed.yaml ...

repave:
  durability:
    enabled: true
    databaseUrl: postgresql://repave:change-me@postgres.repave.svc:5432/repave
    exportJsonl: false
    workerMode: external
    executionMode: worker
    requireSessionSecret: true
    # Optional: full staging-tree retention (preview snapshots default in result_json).
    # artifactStoreUri: s3://repave-artifacts/prod

  audit:
    enabled: true
  auth:
    serviceMode: true
    oidc:
      issuer: https://auth.example.com
      clientId: repave
      redirectUri: https://repave.example.com/auth/callback
      groupsClaim: groups
      roles:
        admin: []
        generator: []
  license:
    existingSecret: repave-license

# Portal/API: no gate CLIs, no embedded corpus.
image:
  gateToolchain: false
  repository: ghcr.io/opsdevcode/repave-engine-portal

# Worker: gate toolchain image (corpus mounted separately).
workerImage:
  repository: ghcr.io/opsdevcode/repave-engine

# Generation corpus OCI artifact (initContainer copies into emptyDir).
corpus:
  enabled: true
  repository: ghcr.io/opsdevcode/repave-corpus

workerAutoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Optional: set repave.durability.artifactStoreUri for full-tree retention in S3.
