# Overlay: hosted Backstage cutover (ADR 011). Image must exist locally or in GHCR.
# CI: make chart-smoke-backstage. Flag defaults on in values.yaml; this overlay
# also sets portal.html=false, catalog fixtures, and the / vs /api split.
#
# Same-host path split (enable both ingresses when you cut over):
#   /     → Backstage
#   /api  → engine
# HTML portal returns 410 (portal.html=false). CLI and /api/v2 stay.
# Ingress stays opt-in so chart-smoke is unchanged.
ingress:
  hosts:
    - host: repave.example.com
      paths:
        - path: /api
          pathType: Prefix
repave:
  portal:
    html: false
  # Sandbox / My services call /api/v2/environments/vend, which 404s unless
  # the catalog overlay is on. Bundle the platform-dev fixtures (image has none).
  serviceCatalog:
    enabled: true
    bundleExamples: true
  backstage:
    enabled: true
    ingress:
      hosts:
        - host: repave.example.com
          paths:
            - path: /
              pathType: Prefix
