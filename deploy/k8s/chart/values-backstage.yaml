# Overlay: hosted catalog IDP (ADR 011). Image must exist locally or in GHCR.
# CI: make chart-smoke-backstage. Flag defaults on in values.yaml; this overlay
# enables catalog fixtures and the same-host / vs /api vs /idp split.
#
# Same-host path split (enable both ingresses when you cut over):
#   /     → HTML workbench (engine)
#   /api  → engine
#   /idp  → Backstage (catalog, lineage, scaffolder)
# /idp avoids colliding with Backstage's own /catalog route.
# HTML portal stays on (portal.html=true). CLI and /api/v2 stay.
# Ingress stays opt-in so chart-smoke is unchanged.
ingress:
  hosts:
    - host: repave.example.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
repave:
  portal:
    html: true
    # Same-host catalog IDP. Operators on a second host should override.
    backstageUrl: /idp
  # Catalog defaults on in values.yaml; keep it explicit on the overlay.
  serviceCatalog:
    enabled: true
    bundleExamples: true
  backstage:
    enabled: true
    extraEnv:
      - name: REPAVE_PORTAL_BASE_URL
        value: /
    ingress:
      hosts:
        - host: repave.example.com
          paths:
            - path: /idp
              pathType: Prefix
