# Default values for the repave portal/API chart.
# Build from deploy/local/Dockerfile (INSTALL_GATE_TOOLCHAIN=1 by default).

replicaCount: 1

# Rolling update and graceful termination (in-flight generations may run for minutes).
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 120

lifecycle:
  preStop:
    enabled: true
    # Brief sleep so endpoints remove the pod before SIGTERM (uvicorn drains open connections).
    sleepSeconds: 15

image:
  repository: ghcr.io/opsdevcode/repave-engine
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent
  # true: image built with INSTALL_GATE_TOOLCHAIN=1 (Plan/dry-run runs real gates).
  # false: portal-only image (INSTALL_GATE_TOOLCHAIN=0); set repository/tag to that build.
  gateToolchain: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8088

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: repave.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Sizing for gate-toolchain image (Plan/dry-run). Portal-only images can lower CPU/memory.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# repave.config.yaml content (non-secret). Secrets below override via env where supported.
repave:
  env: production
  output:
    githubOrg: your-github-org
    modulesRoot: /data/modules
    repoNameTemplate: "tf-{module_name}"
  portal:
    density: default
  gates:
    checkov:
      skipChecks: []
    policy:
      requiredRules:
        - checkov:CKV2_REPAVE_1
        - opa:destructive_changes
  audit:
    enabled: false
    file: /data/audit/generation.jsonl
  fleet:
    enabled: false
    file: /data/fleet/registry.jsonl
  durability:
    # Async run queue (Phase 1 durability). Recommended for in-cluster deploys.
    enabled: true
    maxConcurrentRuns: 2
    queueMaxDepth: 32
    runsDb: /data/runs/runs.sqlite
    requireSessionSecret: false
    databaseUrl: ""
    exportJsonl: true
    workerMode: inline
    workerReplicas: 1
    workerPollSeconds: 5
  auth:
    serviceMode: false
    oidc:
      issuer: ""
      clientId: ""
      redirectUri: ""
      groupsClaim: groups
      roles:
        admin: []
        generator: []

# Optional persistence for module staging, audit, and fleet JSONL sinks.
persistence:
  modules:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  audit:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  fleet:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  runs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""

# Graceful shutdown: drain async runs before SIGKILL (keep below terminationGracePeriodSeconds).
shutdown:
  drainSeconds: 105
  readyRequireGithub: false

secrets:
  # When true, chart creates a Secret from the values below (dev/kind only).
  create: false
  existingSecret: ""
  githubToken: ""
  sessionSecret: ""
  oidcClientSecret: ""

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    path: /health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
