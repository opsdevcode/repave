# Default values for the repave portal/API chart.
# Build from deploy/local/Dockerfile (INSTALL_GATE_TOOLCHAIN=1 by default).

replicaCount: 1

# Rolling update and graceful termination (in-flight generations may run for minutes).
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 120

lifecycle:
  preStop:
    enabled: true
    # Brief sleep so endpoints remove the pod before SIGTERM (uvicorn drains open connections).
    sleepSeconds: 15

image:
  repository: ghcr.io/opsdevcode/repave-engine
  tag: "" # defaults to Chart.appVersion
  digest: "" # when set, image is repository@digest instead of repository:tag
  pullPolicy: IfNotPresent
  # true: image built with INSTALL_GATE_TOOLCHAIN=1 (Plan/dry-run runs real gates).
  # false: portal-only image (INSTALL_GATE_TOOLCHAIN=0); set repository/tag to that build.
  gateToolchain: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# e.g. [{ name: ghcr-pull }] for private GHCR portal/worker/corpus images.
imagePullSecrets: []

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8088

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: repave.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Sizing for gate-toolchain image (Plan/dry-run). Portal-only images can lower CPU/memory.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# HPA for external run-worker Deployment (requires workerMode: external).
workerAutoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# repave.config.yaml content (non-secret). Secrets below override via env where supported.
repave:
  env: production
  output:
    githubOrg: your-github-org
    modulesRoot: /data/modules
    repoNameTemplate: "tf-{module_name}"
  portal:
    density: default
  gates:
    checkov:
      skipChecks: []
    policy:
      requiredRules:
        - checkov:CKV2_REPAVE_1
        - opa:destructive_changes
  audit:
    enabled: false
    file: /data/audit/generation.jsonl
  fleet:
    enabled: false
    file: /data/fleet/registry.jsonl
    # JSON snapshot for operator GPR/campaign status (portal /platform/campaigns).
    operatorStatusFile: /data/fleet/operator-status.json
  durability:
    # Async run queue (Phase 1 durability). Recommended for in-cluster deploys.
    enabled: true
    maxConcurrentRuns: 2
    queueMaxDepth: 32
    runsDb: /data/runs/runs.sqlite
    requireSessionSecret: false
    databaseUrl: ""
    exportJsonl: true
    workerMode: inline
    # inline | external (Deployment poll) | job (one Kubernetes Job per run)
    workerReplicas: 1
    workerPollSeconds: 5
    maxRunAttempts: 3
    runStaleSeconds: 3600
    runRetryBaseSeconds: 5
    # inprocess (default) | worker — API enqueue-only when worker (see docs/durability.md)
    executionMode: ""
    # s3://bucket/prefix for async run artifacts when portal and worker are split (Phase 2).
    artifactStoreUri: ""
  auth:
    serviceMode: false
    # Secure session cookies (Secure flag). Default true when serviceMode is enabled in app.
    sessionHttpsOnly: true
    oidc:
      issuer: ""
      clientId: ""
      redirectUri: ""
      logoutReturnTo: ""
      groupsClaim: groups
      scopes:
        - openid
        - profile
        - email
      roles:
        admin: []
        generator: []

  # Authoritative Terraform state store (ADR 004 Phases 1–3). Off by default.
  # Shared deploy: values-state-store.yaml + docs/operations/state-store-enablement.md
  # Do not enable without KEK, Postgres 14+ PITR, security sign-off, and treadmill owner.
  stateStore:
    enabled: false
    databaseUrl: ""
    defaultTenant: default
    requiredGates: []

  environmentVending:
    # Governed environment stacks (ADR 003 Phase 3). Requires GITHUB_TOKEN for reclaim/vend.
    enabled: false
    gitopsRepo: ""
    baseBranch: main
    pathPrefix: environments
    file: /data/environments/registry.jsonl
    defaultTtlHours: 0
    ttlHoursByClass: {}
    autoReclaimClasses:
      - sandbox
    decommissionReviewClasses: []

# Scheduled TTL reclaim for vended environments (requires environmentVending.enabled).
environmentReclaim:
  cronJob:
    enabled: false
    # cli: run repave environments reclaim in-cluster (needs registry volume + GITHUB_TOKEN).
    # http: POST /api/v2/environments/reclaim on the portal Service (needs REPAVE_API_TOKEN when auth.service_mode is on).
    invoke: cli
    apiBaseUrl: ""
    schedule: "0 * * * *"
    dryRun: false
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    restartPolicy: OnFailure
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Scheduled operator status snapshot for fleet portal overlays (requires repave.fleet.enabled).
fleetOperatorSnapshot:
  cronJob:
    enabled: false
    # Namespace where GoldenPathRepo and UpgradeCampaign objects live (operator install).
    operatorNamespace: ""
    allNamespaces: false
    schedule: "*/15 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    restartPolicy: OnFailure
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Gate-toolchain worker image (external workerMode). Defaults to repave-engine when repository is empty.
workerImage:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: ""

# Digest-pinned generation corpus mounted read-only (Phase 2 decomposition).
corpus:
  enabled: false
  repository: ghcr.io/opsdevcode/repave-corpus
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Optional persistence for module staging, audit, and fleet JSONL sinks.
persistence:
  modules:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
    # kind co-install only: hostPath on the kind node (see values-kind.yaml).
    kindHostPath: ""
  audit:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  fleet:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  runs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""
  environments:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""

# Graceful shutdown: drain async runs before SIGKILL (keep below terminationGracePeriodSeconds).
shutdown:
  drainSeconds: 105
  readyRequireGithub: false

# Prometheus Operator (optional). Standalone manifests also live in deploy/k8s/.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRules:
    enabled: false
    labels: {}
    queueBacklogThreshold: 28
    # Requires kube-prometheus-stack / kube-state-metrics when true.
    includeKubeStateAlerts: false
    runbooks:
      generationFailures: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#generation-failures
      scaleOut: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#scale-out
      slowGenerations: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#slow-generations
      readiness: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#readiness-failures
      github: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#github-publish-failures
      durability: https://github.com/opsdevcode/repave/blob/main/docs/operations/README.md#stuck-async-queue

secrets:
  # When true, chart creates a Secret from the values below (dev/kind only).
  create: false
  existingSecret: ""
  githubToken: ""
  githubAppId: ""
  githubAppInstallationId: ""
  githubAppPrivateKey: ""
  sessionSecret: ""
  oidcClientSecret: ""
  apiToken: ""
  # Base64 32-byte KEK for state blob encryption (openssl rand -base64 32).
  # Required when repave.stateStore.enabled; never commit a real key.
  stateKek: ""
  stateKekId: "default"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    path: /health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
