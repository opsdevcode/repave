{{- if .Values.repave.backstage.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "repave.fullname" . }}-backstage
  labels:
    {{- include "repave.labels" . | nindent 4 }}
    app.kubernetes.io/component: backstage
spec:
  type: {{ .Values.repave.backstage.service.type }}
  ports:
    - port: {{ .Values.repave.backstage.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "repave.backstageSelectorLabels" . | nindent 4 }}
{{- end }}
