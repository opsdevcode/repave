{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "repave.fullname" . }}
  labels:
    {{- include "repave.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: repave.generation
      rules:
        - alert: RepaveGenerationFailureRateHigh
          expr: |
            (
              sum(rate(repave_generations_total{outcome="failed"}[15m]))
              /
              clamp_min(sum(rate(repave_generations_total[15m])), 0.001)
            ) > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Repave generation failure rate above 25%
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.generationFailures | quote }}

        - alert: RepaveGenerationLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(repave_generation_seconds_bucket[15m])) by (le, blueprint)
            ) > 120
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Repave p95 generation latency above 120s
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.slowGenerations | quote }}

        - alert: RepaveAsyncRunFailureRateHigh
          expr: |
            (
              sum(rate(repave_async_runs_total{outcome="failed"}[15m]))
              /
              clamp_min(sum(rate(repave_async_runs_total[15m])), 0.001)
            ) > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Repave async run failure rate above 25%
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.generationFailures | quote }}

        - alert: RepaveAsyncRunDeadLetterRate
          expr: |
            sum(rate(repave_async_runs_total{outcome="dead_letter"}[15m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Repave async runs entering dead letter
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.generationFailures | quote }}

        - alert: RepaveRunQueueBacklogHigh
          expr: repave_run_queue_inflight >= {{ .Values.monitoring.prometheusRules.queueBacklogThreshold }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Repave async run queue depth is high
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.scaleOut | quote }}

        - alert: RepaveJsonlAppendFailures
          expr: |
            sum(rate(repave_jsonl_append_failures_total[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Repave JSONL export mirror append failures
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.durability | quote }}

    {{- if .Values.monitoring.prometheusRules.includeKubeStateAlerts }}
    - name: repave.kubernetes
      rules:
        - alert: RepaveHPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~"{{ include "repave.fullname" . }}.*"}
            ==
            kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~"{{ include "repave.fullname" . }}.*"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Repave HPA at max replicas for 15m
            runbook_url: {{ .Values.monitoring.prometheusRules.runbooks.scaleOut | quote }}
    {{- end }}
{{- end }}
