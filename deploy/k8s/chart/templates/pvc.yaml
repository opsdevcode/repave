  {{- if .Values.persistence.audit.storageClass }}
  storageClassName: {{ .Values.persistence.audit.storageClass | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.repave.fleet.enabled .Values.persistence.fleet.enabled (not .Values.persistence.fleet.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
