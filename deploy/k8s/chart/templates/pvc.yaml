{{- if and .Values.persistence.modules.enabled (not .Values.persistence.modules.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "repave.fullname" . }}-modules
  labels:
    {{- include "repave.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.modules.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.modules.size }}
  {{- if .Values.persistence.modules.storageClass }}
  storageClassName: {{ .Values.persistence.modules.storageClass | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.repave.audit.enabled .Values.persistence.audit.enabled (not .Values.persistence.audit.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
