{{- if .Values.repave.backstage.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repave.fullname" . }}-backstage
  labels:
    {{- include "repave.labels" . | nindent 4 }}
    app.kubernetes.io/component: backstage
spec:
  replicas: {{ .Values.repave.backstage.replicaCount }}
  selector:
    matchLabels:
      {{- include "repave.backstageSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repave.backstageSelectorLabels" . | nindent 8 }}
        backstage.io/kubernetes-id: example-website
    spec:
      serviceAccountName: {{ include "repave.backstageServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backstage
          image: {{ include "repave.backstageImage" . }}
          imagePullPolicy: {{ .Values.repave.backstage.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: REPAVE_API_BASE_URL
              value: {{ default (printf "http://%s:%v" (include "repave.fullname" .) .Values.service.port) .Values.repave.backstage.apiBaseUrl | quote }}
            - name: REPAVE_API_TOKEN
              value: ""
            - name: GITHUB_TOKEN
              value: ""
            - name: GITHUB_ORG
              value: {{ .Values.repave.output.githubOrg | quote }}
            - name: REPAVE_PORTAL_LOGO_URL
              value: {{ .Values.repave.portal.logoUrl | quote }}
            - name: REPAVE_PORTAL_ACCENT_COLOR
              value: {{ .Values.repave.portal.accentColor | quote }}
            {{- if .Values.repave.backstage.publicBaseUrl }}
            - name: APP_BASE_URL
              value: {{ .Values.repave.backstage.publicBaseUrl | quote }}
            {{- end }}
            {{- with .Values.repave.backstage.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: {{ .Values.repave.backstage.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.repave.backstage.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.repave.backstage.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: {{ .Values.repave.backstage.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.repave.backstage.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.repave.backstage.probes.readiness.failureThreshold }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
{{- end }}
