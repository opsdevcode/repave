apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repave.fullname" . }}
  labels:
    {{- include "repave.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "repave.portalSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "repave.portalSelectorLabels" . | nindent 8 }}
        repave.dev/gate-toolchain: {{ ternary "true" "false" .Values.image.gateToolchain | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "repave.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.corpus.enabled }}
      initContainers:
        {{- include "repave.corpusInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: repave
          image: {{ include "repave.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - repave
            - serve
            - --repo-root
            - /app
            - --host
            - "0.0.0.0"
            - --port
            - "8088"
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          env:
            - name: REPAVE_IMAGE_GATE_TOOLCHAIN
              value: {{ ternary "1" "0" .Values.image.gateToolchain | quote }}
            - name: REPAVE_ENV
              value: {{ .Values.repave.env | quote }}
            {{- if .Values.repave.durability.enabled }}
            - name: REPAVE_ASYNC_GENERATION
              value: "1"
            - name: REPAVE_RUNS_DB
              value: {{ .Values.repave.durability.runsDb | quote }}
            {{- include "repave.databaseUrlEnv" . | nindent 12 }}
            {{- if eq .Values.repave.durability.workerMode "external" }}
            - name: REPAVE_EXTERNAL_WORKERS
              value: "1"
            - name: REPAVE_EXECUTION_MODE
              value: worker
            {{- else if eq .Values.repave.durability.workerMode "job" }}
            - name: REPAVE_EXTERNAL_WORKERS
              value: "1"
            - name: REPAVE_EXECUTION_MODE
              value: worker
            - name: REPAVE_RUN_JOBS
              value: "1"
            - name: REPAVE_RUN_JOB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPAVE_RUN_JOB_IMAGE
              value: {{ include "repave.workerImage" . | quote }}
            - name: REPAVE_RUN_JOB_CONFIGMAP
              value: {{ include "repave.fullname" . | quote }}
            - name: REPAVE_RUN_JOB_SERVICE_ACCOUNT
              value: {{ include "repave.serviceAccountName" . | quote }}
            {{- if .Values.corpus.enabled }}
            - name: REPAVE_RUN_JOB_CORPUS_IMAGE
              value: {{ include "repave.corpusImage" . | quote }}
            {{- end }}
            {{- $secretName := include "repave.secretName" . }}
            {{- if $secretName }}
            - name: REPAVE_RUN_JOB_GITHUB_SECRET
              value: {{ $secretName | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.repave.durability.artifactStoreUri }}
            - name: REPAVE_ARTIFACT_STORE_URI
              value: {{ .Values.repave.durability.artifactStoreUri | quote }}
            {{- end }}
            - name: REPAVE_SHUTDOWN_DRAIN_SECONDS
              value: {{ .Values.shutdown.drainSeconds | quote }}
            {{- if .Values.shutdown.readyRequireGithub }}
            - name: REPAVE_READY_REQUIRE_GITHUB
              value: "1"
            {{- end }}
            - name: REPAVE_GITHUB_ORG
              value: {{ .Values.repave.output.githubOrg | quote }}
            - name: REPAVE_MODULES_ROOT
              value: {{ .Values.repave.output.modulesRoot | quote }}
            {{- if .Values.repave.auth.serviceMode }}
            - name: REPAVE_SERVICE_MODE
              value: "1"
            - name: REPAVE_SESSION_HTTPS_ONLY
              value: {{ ternary "1" "0" .Values.repave.auth.sessionHttpsOnly | quote }}
            {{- end }}
            {{- if .Values.repave.audit.enabled }}
            - name: REPAVE_AUDIT_FILE
              value: {{ .Values.repave.audit.file | quote }}
            {{- end }}
            {{- if .Values.repave.fleet.enabled }}
            - name: REPAVE_FLEET_FILE
              value: {{ .Values.repave.fleet.file | quote }}
            {{- if .Values.repave.fleet.operatorStatusFile }}
            - name: REPAVE_FLEET_OPERATOR_STATUS_FILE
              value: {{ .Values.repave.fleet.operatorStatusFile | quote }}
            {{- end }}
            {{- end }}
            {{- include "repave.environmentVendingEnv" . | nindent 12 }}
            {{- $secretName := include "repave.secretName" . }}
            {{- if $secretName }}
            {{- include "repave.githubAuthEnv" . | nindent 12 }}
            - name: REPAVE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: session-secret
                  optional: true
            - name: REPAVE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: oidc-client-secret
                  optional: true
            {{- include "repave.apiTokenEnv" . | nindent 12 }}
            {{- end }}
            {{- include "repave.stateStoreEnv" . | nindent 12 }}
          {{- if .Values.lifecycle.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.lifecycle.preStop.sleepSeconds }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/repave.config.yaml
              subPath: repave.config.yaml
            - name: modules
              mountPath: {{ .Values.repave.output.modulesRoot }}
            {{- include "repave.corpusVolumeMounts" . | nindent 12 }}
            {{- if .Values.repave.audit.enabled }}
            - name: audit
              mountPath: /data/audit
            {{- end }}
            {{- if .Values.repave.fleet.enabled }}
            - name: fleet
              mountPath: /data/fleet
            {{- end }}
            {{- if .Values.repave.durability.enabled }}
            - name: runs
              mountPath: /data/runs
            {{- end }}
            {{- include "repave.environmentDataVolumeMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "repave.fullname" . }}
        - name: modules
          {{- if .Values.persistence.modules.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.modules.existingClaim }}
          {{- else if .Values.persistence.modules.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "repave.fullname" . }}-modules
          {{- else if .Values.persistence.modules.kindHostPath }}
          hostPath:
            path: {{ .Values.persistence.modules.kindHostPath | quote }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "repave.corpusVolume" . | nindent 8 }}
        {{- if .Values.repave.audit.enabled }}
        - name: audit
          {{- if and .Values.persistence.audit.enabled (not .Values.persistence.audit.existingClaim) }}
          persistentVolumeClaim:
            claimName: {{ include "repave.fullname" . }}-audit
          {{- else if .Values.persistence.audit.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.audit.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.repave.fleet.enabled }}
        - name: fleet
          {{- if and .Values.persistence.fleet.enabled (not .Values.persistence.fleet.existingClaim) }}
          persistentVolumeClaim:
            claimName: {{ include "repave.fullname" . }}-fleet
          {{- else if .Values.persistence.fleet.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.fleet.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.repave.durability.enabled }}
        - name: runs
          {{- if and .Values.persistence.runs.enabled (not .Values.persistence.runs.existingClaim) }}
          persistentVolumeClaim:
            claimName: {{ include "repave.fullname" . }}-runs
          {{- else if .Values.persistence.runs.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.runs.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- include "repave.environmentDataVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
