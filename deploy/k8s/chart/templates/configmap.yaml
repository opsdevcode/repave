apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repave.fullname" . }}
  labels:
    {{- include "repave.labels" . | nindent 4 }}
data:
  repave.config.yaml: |
    output:
      github_org: {{ .Values.repave.output.githubOrg | quote }}
      modules_root: {{ .Values.repave.output.modulesRoot | quote }}
      repo_name_template: {{ .Values.repave.output.repoNameTemplate | quote }}
    portal:
      density: {{ .Values.repave.portal.density | quote }}
    gates:
      checkov:
        skip_checks:
{{ toYaml .Values.repave.gates.checkov.skipChecks | indent 10 }}
      policy:
        required_rules:
{{ toYaml .Values.repave.gates.policy.requiredRules | indent 10 }}
    {{- if .Values.repave.audit.enabled }}
    audit:
      enabled: true
      file: {{ .Values.repave.audit.file | quote }}
    {{- end }}
    {{- if .Values.repave.fleet.enabled }}
    fleet:
      enabled: true
      file: {{ .Values.repave.fleet.file | quote }}
      {{- if .Values.repave.fleet.operatorStatusFile }}
      operator_status_file: {{ .Values.repave.fleet.operatorStatusFile | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.repave.auth.serviceMode }}
    auth:
      service_mode: true
      session_https_only: {{ .Values.repave.auth.sessionHttpsOnly }}
      oidc:
        issuer: {{ .Values.repave.auth.oidc.issuer | quote }}
        client_id: {{ .Values.repave.auth.oidc.clientId | quote }}
        redirect_uri: {{ .Values.repave.auth.oidc.redirectUri | quote }}
        {{- if .Values.repave.auth.oidc.logoutReturnTo }}
        logout_return_to: {{ .Values.repave.auth.oidc.logoutReturnTo | quote }}
        {{- end }}
        groups_claim: {{ .Values.repave.auth.oidc.groupsClaim | quote }}
        scopes:
{{ toYaml .Values.repave.auth.oidc.scopes | indent 10 }}
        roles:
          admin:
{{ toYaml .Values.repave.auth.oidc.roles.admin | indent 12 }}
          generator:
{{ toYaml .Values.repave.auth.oidc.roles.generator | indent 12 }}
    {{- end }}
    {{- if .Values.repave.durability.enabled }}
    durability:
      async_generation: true
      max_concurrent_runs: {{ .Values.repave.durability.maxConcurrentRuns }}
      queue_max_depth: {{ .Values.repave.durability.queueMaxDepth }}
      runs_db: {{ .Values.repave.durability.runsDb | quote }}
      require_session_secret: {{ .Values.repave.durability.requireSessionSecret }}
      {{- if .Values.repave.durability.databaseUrl }}
      database_url: {{ .Values.repave.durability.databaseUrl | quote }}
      {{- end }}
      export_jsonl: {{ .Values.repave.durability.exportJsonl }}
      worker_mode: {{ .Values.repave.durability.workerMode | quote }}
      {{- if or (eq .Values.repave.durability.workerMode "external") (eq .Values.repave.durability.workerMode "job") }}
      execution_mode: worker
      {{- else if .Values.repave.durability.executionMode }}
      execution_mode: {{ .Values.repave.durability.executionMode | quote }}
      {{- end }}
      {{- if .Values.repave.durability.artifactStoreUri }}
      artifact_store_uri: {{ .Values.repave.durability.artifactStoreUri | quote }}
      {{- end }}
      max_run_attempts: {{ .Values.repave.durability.maxRunAttempts }}
      run_stale_seconds: {{ .Values.repave.durability.runStaleSeconds }}
      run_retry_base_seconds: {{ .Values.repave.durability.runRetryBaseSeconds }}
    {{- end }}
    {{- if include "repave.environmentVendingEnabled" . }}
    environment_vending:
      enabled: true
      gitops_repo: {{ .Values.repave.environmentVending.gitopsRepo | quote }}
      base_branch: {{ .Values.repave.environmentVending.baseBranch | quote }}
      path_prefix: {{ .Values.repave.environmentVending.pathPrefix | quote }}
      file: {{ .Values.repave.environmentVending.file | quote }}
      default_ttl_hours: {{ .Values.repave.environmentVending.defaultTtlHours }}
      {{- if .Values.repave.environmentVending.ttlHoursByClass }}
      ttl_hours_by_class:
{{ toYaml .Values.repave.environmentVending.ttlHoursByClass | indent 8 }}
      {{- end }}
      auto_reclaim_classes:
{{ toYaml .Values.repave.environmentVending.autoReclaimClasses | indent 8 }}
      {{- if .Values.repave.environmentVending.decommissionReviewClasses }}
      decommission_review_classes:
{{ toYaml .Values.repave.environmentVending.decommissionReviewClasses | indent 8 }}
      {{- end }}
    {{- end }}
