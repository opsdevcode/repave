{{- if and .Values.repave.v3.developerLab.enabled (not .Values.repave.v3.enabled) }}
{{- fail "repave.v3.developerLab.enabled requires repave.v3.enabled (ADR 008)" }}
{{- end }}
{{- if and .Values.repave.v3.autoMerge.enabled (not .Values.repave.v3.enabled) }}
{{- fail "repave.v3.autoMerge.enabled requires repave.v3.enabled (ADR 008)" }}
{{- end }}
{{- if and .Values.repave.v3.mandatoryPolicy.enabled (not .Values.repave.v3.enabled) }}
{{- fail "repave.v3.mandatoryPolicy.enabled requires repave.v3.enabled (ADR 008)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repave.fullname" . }}
  labels:
    {{- include "repave.labels" . | nindent 4 }}
data:
  repave.config.yaml: |
    output:
      github_org: {{ .Values.repave.output.githubOrg | quote }}
      modules_root: {{ .Values.repave.output.modulesRoot | quote }}
      repo_name_template: {{ .Values.repave.output.repoNameTemplate | quote }}
    portal:
      html: {{ .Values.repave.portal.html }}
      density: {{ .Values.repave.portal.density | quote }}
      {{- if .Values.repave.portal.backstageUrl }}
      backstage_url: {{ .Values.repave.portal.backstageUrl | quote }}
      {{- end }}
      {{- if .Values.repave.portal.logoUrl }}
      logo_url: {{ .Values.repave.portal.logoUrl | quote }}
      {{- end }}
      {{- if .Values.repave.portal.accentColor }}
      accent_color: {{ .Values.repave.portal.accentColor | quote }}
      {{- end }}
      {{- if .Values.repave.portal.costSnapshots.enabled }}
      cost_snapshots:
        enabled: {{ .Values.repave.portal.costSnapshots.enabled }}
        file: {{ .Values.repave.portal.costSnapshots.file | quote }}
      {{- end }}
      {{- if .Values.repave.portal.costBudgets.enabled }}
      cost_budgets:
        {{- if .Values.repave.portal.costBudgets.defaultMonthlyUsd }}
        default_monthly_usd: {{ .Values.repave.portal.costBudgets.defaultMonthlyUsd }}
        {{- end }}
        {{- if .Values.repave.portal.costBudgets.entities }}
        entities:
{{ toYaml .Values.repave.portal.costBudgets.entities | indent 10 }}
        {{- end }}
      {{- end }}
    gates:
      checkov:
        skip_checks:
{{ toYaml .Values.repave.gates.checkov.skipChecks | indent 10 }}
      policy:
        required_rules:
{{ toYaml .Values.repave.gates.policy.requiredRules | indent 10 }}
      {{- if or .Values.repave.gates.infracost.required .Values.repave.gates.infracost.maxMonthlyUsd }}
      infracost:
        required: {{ .Values.repave.gates.infracost.required }}
        {{- if .Values.repave.gates.infracost.maxMonthlyUsd }}
        max_monthly_usd: {{ .Values.repave.gates.infracost.maxMonthlyUsd }}
        {{- end }}
      {{- end }}
    {{- if .Values.repave.audit.enabled }}
    audit:
      enabled: true
      file: {{ .Values.repave.audit.file | quote }}
    {{- end }}
    {{- if .Values.repave.fleet.enabled }}
    fleet:
      enabled: true
      file: {{ .Values.repave.fleet.file | quote }}
      {{- if .Values.repave.fleet.operatorStatusFile }}
      operator_status_file: {{ .Values.repave.fleet.operatorStatusFile | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.repave.platformMetrics.enabled }}
    platform_metrics:
      enabled: true
      snapshot_file: {{ .Values.repave.platformMetrics.snapshotFile | quote }}
      feedback_file: {{ .Values.repave.platformMetrics.feedbackFile | quote }}
      search_limit: {{ .Values.repave.platformMetrics.searchLimit }}
      {{- if .Values.repave.platformMetrics.githubOrgs }}
      github_orgs:
{{ toYaml .Values.repave.platformMetrics.githubOrgs | indent 8 }}
      {{- end }}
      {{- if .Values.repave.platformMetrics.githubTopics }}
      github_topics:
{{ toYaml .Values.repave.platformMetrics.githubTopics | indent 8 }}
      {{- end }}
      {{- if not (eq (toString .Values.repave.platformMetrics.baselineAdoptionRatio) "") }}
      baseline_adoption_ratio: {{ .Values.repave.platformMetrics.baselineAdoptionRatio }}
      {{- end }}
      {{- if not (eq (toString .Values.repave.platformMetrics.baselinePlanApplyRatio) "") }}
      baseline_plan_apply_ratio: {{ .Values.repave.platformMetrics.baselinePlanApplyRatio }}
      {{- end }}
    {{- end }}
    {{- if .Values.repave.auth.serviceMode }}
    auth:
      service_mode: true
      coarse_rbac_enabled: {{ .Values.repave.auth.coarseRbacEnabled }}
      session_https_only: {{ .Values.repave.auth.sessionHttpsOnly }}
      oidc:
        issuer: {{ .Values.repave.auth.oidc.issuer | quote }}
        client_id: {{ .Values.repave.auth.oidc.clientId | quote }}
        redirect_uri: {{ .Values.repave.auth.oidc.redirectUri | quote }}
        {{- if .Values.repave.auth.oidc.logoutReturnTo }}
        logout_return_to: {{ .Values.repave.auth.oidc.logoutReturnTo | quote }}
        {{- end }}
        groups_claim: {{ .Values.repave.auth.oidc.groupsClaim | quote }}
        scopes:
{{ toYaml .Values.repave.auth.oidc.scopes | indent 10 }}
        roles:
          admin:
{{ toYaml .Values.repave.auth.oidc.roles.admin | indent 12 }}
          generator:
{{ toYaml .Values.repave.auth.oidc.roles.generator | indent 12 }}
    {{- end }}
    {{- if .Values.repave.durability.enabled }}
    durability:
      async_generation: true
      max_concurrent_runs: {{ .Values.repave.durability.maxConcurrentRuns }}
      queue_max_depth: {{ .Values.repave.durability.queueMaxDepth }}
      runs_db: {{ .Values.repave.durability.runsDb | quote }}
      require_session_secret: {{ .Values.repave.durability.requireSessionSecret }}
      {{- if and .Values.repave.durability.databaseUrl (not .Values.repave.durability.databaseUrlSecret.name) }}
      database_url: {{ .Values.repave.durability.databaseUrl | quote }}
      {{- end }}
      export_jsonl: {{ .Values.repave.durability.exportJsonl }}
      worker_mode: {{ .Values.repave.durability.workerMode | quote }}
      {{- if or (eq .Values.repave.durability.workerMode "external") (eq .Values.repave.durability.workerMode "job") }}
      execution_mode: worker
      {{- else if .Values.repave.durability.executionMode }}
      execution_mode: {{ .Values.repave.durability.executionMode | quote }}
      {{- end }}
      {{- if .Values.repave.durability.artifactStoreUri }}
      artifact_store_uri: {{ .Values.repave.durability.artifactStoreUri | quote }}
      {{- end }}
      max_run_attempts: {{ .Values.repave.durability.maxRunAttempts }}
      run_stale_seconds: {{ .Values.repave.durability.runStaleSeconds }}
      run_retry_base_seconds: {{ .Values.repave.durability.runRetryBaseSeconds }}
    {{- end }}
    {{- if and .Values.repave.stateStore.enabled .Values.repave.stateStore.databaseUrl }}
    state_store:
      enabled: true
      database_url: {{ .Values.repave.stateStore.databaseUrl | quote }}
      default_tenant: {{ .Values.repave.stateStore.defaultTenant | quote }}
      {{- if .Values.repave.stateStore.requiredGates }}
      required_gates:
{{ toYaml .Values.repave.stateStore.requiredGates | indent 8 }}
      {{- end }}
    {{- end }}
    {{- if include "repave.environmentVendingEnabled" . }}
    environment_vending:
      enabled: true
      gitops_repo: {{ .Values.repave.environmentVending.gitopsRepo | quote }}
      base_branch: {{ .Values.repave.environmentVending.baseBranch | quote }}
      path_prefix: {{ .Values.repave.environmentVending.pathPrefix | quote }}
      file: {{ .Values.repave.environmentVending.file | quote }}
      default_ttl_hours: {{ .Values.repave.environmentVending.defaultTtlHours }}
      {{- if .Values.repave.environmentVending.ttlHoursByClass }}
      ttl_hours_by_class:
{{ toYaml .Values.repave.environmentVending.ttlHoursByClass | indent 8 }}
      {{- end }}
      auto_reclaim_classes:
{{ toYaml .Values.repave.environmentVending.autoReclaimClasses | indent 8 }}
      {{- if .Values.repave.environmentVending.decommissionReviewClasses }}
      decommission_review_classes:
{{ toYaml .Values.repave.environmentVending.decommissionReviewClasses | indent 8 }}
      {{- end }}
    {{- end }}
    {{- if .Values.repave.v3.enabled }}
    v3:
      enabled: true
      developer_lab:
        enabled: {{ .Values.repave.v3.developerLab.enabled }}
      auto_merge:
        enabled: {{ .Values.repave.v3.autoMerge.enabled }}
        kill_switch: {{ .Values.repave.v3.autoMerge.killSwitch }}
      mandatory_policy:
        enabled: {{ .Values.repave.v3.mandatoryPolicy.enabled }}
        regulated_families:
{{ toYaml .Values.repave.v3.mandatoryPolicy.regulatedFamilies | indent 10 }}
    {{- end }}
    {{- if .Values.repave.serviceCatalog.enabled }}
    service_catalog:
      enabled: true
      maturity_rubric: {{ .Values.repave.serviceCatalog.maturityRubric | quote }}
      workload_profiles: {{ .Values.repave.serviceCatalog.workloadProfiles | quote }}
      deployment_sets: {{ .Values.repave.serviceCatalog.deploymentSets | quote }}
      initiatives: {{ .Values.repave.serviceCatalog.initiatives | quote }}
      default_team: {{ .Values.repave.serviceCatalog.defaultTeam | quote }}
    {{- end }}
