---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: blueprints.repave.dev
spec:
  group: repave.dev
  names:
    kind: Blueprint
    listKind: BlueprintList
    plural: blueprints
    shortNames:
    - bp
    singular: blueprint
  scope: Namespaced
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        caBundle: {{ required "webhook.caBundle is required when crds.install=true" .Values.webhook.caBundle }}
        service:
          name: {{ .Values.service.webhook.name }}
          namespace: {{ .Release.Namespace }}
          path: /convert
          port: 443
      conversionReviewVersions:
      - v1
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.standard.version
      name: Standard
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Blueprint mirrors repave catalog pin versions for fleet-wide
          desired state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BlueprintSpec defines catalog pin versions for a golden path
              blueprint.
            properties:
              standard:
                description: Standard pins the governance corpus applied at generation
                  time.
                properties:
                  source:
                    description: Source is the in-repo or URI path to the standard
                      corpus.
                    minLength: 1
                    type: string
                  version:
                    description: Version is the semver of the standard corpus.
                    minLength: 1
                    type: string
                required:
                - source
                - version
                type: object
              version:
                description: Version is the semver of the blueprint template.
                minLength: 1
                type: string
            required:
            - standard
            - version
            type: object
          status:
            description: BlueprintStatus records the last observed spec generation.
            properties:
              observedGeneration:
                description: ObservedGeneration reflects the metadata.generation last
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.standard.version
      name: Standard
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Blueprint mirrors repave catalog pin versions for fleet-wide
          desired state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BlueprintSpec defines catalog pin versions for a golden path
              blueprint.
            properties:
              standard:
                description: Standard pins the governance corpus applied at generation
                  time.
                properties:
                  source:
                    description: Source is the in-repo or URI path to the standard
                      corpus.
                    minLength: 1
                    type: string
                  version:
                    description: Version is the semver of the standard corpus.
                    minLength: 1
                    type: string
                required:
                - source
                - version
                type: object
              version:
                description: Version is the semver of the blueprint template.
                minLength: 1
                type: string
            required:
            - standard
            - version
            type: object
          status:
            description: BlueprintStatus records the last observed spec generation
              and published pin target.
            properties:
              conditions:
                description: Conditions describe operability of the Blueprint target.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration reflects the metadata.generation last
                  reconciled.
                format: int64
                type: integer
              targetPins:
                description: TargetPins mirrors spec pin fields for fleet queries
                  and kubectl columns.
                properties:
                  standardSource:
                    description: StandardSource is the in-repo or URI path to the
                      standard corpus.
                    type: string
                  standardVersion:
                    description: StandardVersion is the semver of the standard corpus.
                    type: string
                  version:
                    description: Version is the semver of the blueprint template.
                    type: string
                required:
                - standardSource
                - standardVersion
                - version
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
