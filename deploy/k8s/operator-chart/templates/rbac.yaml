apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "repave-operator.fullname" . }}
  labels:
    {{- include "repave-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["repave.dev"]
    resources: ["blueprints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["repave.dev"]
    resources: ["blueprints/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["repave.dev"]
    resources: ["upgradecampaigns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["repave.dev"]
    resources: ["upgradecampaigns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["repave.dev"]
    resources: ["goldenpathrepos/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "repave-operator.fullname" . }}
  labels:
    {{- include "repave-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "repave-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "repave-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.manager.leaderElect }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "repave-operator.fullname" . }}-leader-election
  labels:
    {{- include "repave-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "repave-operator.fullname" . }}-leader-election
  labels:
    {{- include "repave-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "repave-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "repave-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
