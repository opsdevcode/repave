services:
  repave:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      args:
        # Set UV_SOURCE=pip when ghcr.io is unreachable, and REPAVE_TLS_INSECURE=1
        # only when a TLS-inspecting proxy leaves no other option (see README).
        UV_SOURCE: ${UV_SOURCE:-registry}
        REPAVE_TLS_INSECURE: ${REPAVE_TLS_INSECURE:-0}
        INSTALL_ANSIBLE_COLLECTIONS: ${INSTALL_ANSIBLE_COLLECTIONS:-1}
    ports:
      - "8088:8088"
    environment:
      REPAVE_ENV: local
      REPAVE_SERVICE_CATALOG: "1"
      REPAVE_GITHUB_ORG: opsdevcode
      REPAVE_MODULES_ROOT: /modules
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin
    volumes:
      - ../..:/app
      - repave-modules:/modules
    working_dir: /app
    command:
      [
        "repave",
        "serve",
        "--repo-root",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "8088",
        "--reload",
      ]

volumes:
  repave-modules:
