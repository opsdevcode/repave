services:
  repave:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    ports:
      - "8088:8088"
    environment:
      REPAVE_ENV: local
      REPAVE_GITHUB_ORG: opsdevcode
      REPAVE_MODULES_ROOT: /modules
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin
      # Unset REPAVE_RELAX_GATES so portal runs full gates (missing tools → FAIL, not SKIP).
    volumes:
      - ../..:/app
      - repave-modules:/modules
    working_dir: /app
    command:
      [
        "repave",
        "serve",
        "--repo-root",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "8088",
        "--reload",
      ]

volumes:
  repave-modules:
