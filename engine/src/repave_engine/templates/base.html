<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{% block title %}repave{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/repave.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="shell">
      <div class="shell__atmosphere" aria-hidden="true"></div>
      <header class="shell__bar">
        <a class="shell__brand" href="/" aria-label="repave home">
          <span class="shell__wordmark">repave</span>
        </a>
        <nav class="shell__nav" aria-label="Primary">
          <a href="/" {% if nav_active == "catalog" %}aria-current="page"{% endif %}>
            Golden paths
          </a>
        </nav>
        <div class="shell__meta">
          {% if env_badge %}
          <span class="badge badge--env">{{ env_badge }}</span>
          {% endif %}
        </div>
      </header>

      <main class="shell__main">
        {% block content %}{% endblock %}
      </main>

      <footer class="shell__footer">
        Governed golden paths · engine {{ app_version }}
      </footer>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
