<div
  class="segmented publish-toggle form-actions__delivery"
  role="radiogroup"
  aria-label="Delivery mode"
>
  <label class="segmented__option">
    <input type="radio" name="dry_run" value="true" checked data-delivery-plan />
    Plan (validate only)
  </label>
  <label class="segmented__option">
    <input type="radio" name="dry_run" value="false" data-delivery-apply />
    Apply (publish to GitHub)
  </label>
</div>
