<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 40" role="img" aria-labelledby="title desc">
  <title id="title">Repave Converge mark</title>
  <desc id="desc">Fragmented inputs converge into a single governed golden path and forward arrow.</desc>
  <!-- Fragmented pixels (left) -->
  <g fill="#0F172A">
    <rect x="2" y="6" width="4" height="4" rx="0.5"/>
    <rect x="8" y="4" width="3.5" height="3.5" rx="0.5"/>
    <rect x="4" y="13" width="3.5" height="3.5" rx="0.5"/>
    <rect x="10" y="12" width="4" height="4" rx="0.5"/>
    <rect x="3" y="20" width="3" height="3" rx="0.5"/>
    <rect x="8" y="19" width="3.5" height="3.5" rx="0.5"/>
    <rect x="5" y="27" width="4" height="4" rx="0.5"/>
    <rect x="11" y="26" width="3" height="3" rx="0.5"/>
  </g>
  <g fill="#64748B">
    <rect x="14" y="7" width="3" height="3" rx="0.5"/>
    <rect x="15" y="22" width="3" height="3" rx="0.5"/>
    <rect x="12" y="31" width="3.5" height="3.5" rx="0.5"/>
  </g>
  <!-- Paths: top / golden / bottom → converge -->
  <path d="M18 10 H42 L54 18 H62" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 20 H48 L54 20 H62" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 30 H42 L54 22 H62" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forward arrow -->
  <path d="M64 12 L86 20 L64 28 Z" fill="#0F172A"/>
</svg>
