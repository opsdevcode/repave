[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repave-engine"
version = "1.126.0"
description = "Governed, repeatable platform engineering generation engine"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Eric Skaggs" }]
dependencies = [
  "copier>=9.0.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "fastapi>=0.110.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "PyJWT[crypto]>=2.10.0",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "httpx>=0.27.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "bandit[toml]>=1.8.0",
  "pip-audit>=2.9.0",
  "types-PyYAML",
]
otel = [
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
postgres = [
  "psycopg[binary]>=3.2",
]
s3 = [
  "boto3>=1.34",
]
cost-aws = [
  "boto3>=1.34",
]
cost-azure = [
  "azure-identity>=1.19",
]

[project.scripts]
repave = "repave_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repave_engine = ["templates/*.html", "templates/partials/*.html", "templates/ci/*", "static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "slow: full Copier render and real gate toolchain (excluded from make test-fast)",
]

[tool.coverage.run]
source = ["repave_engine"]
branch = false

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = ["src"]
packages = ["repave_engine"]

[[tool.mypy.overrides]]
module = ["copier.*", "jsonschema.*", "opentelemetry.*", "boto3.*", "azure.identity.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]  # subprocess module import where shell=True is intentional

[tool.semantic_release]
# Git root is one level up; keeps changelog and tags aligned with the monorepo.
repo_dir = ".."
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/repave_engine/__init__.py:__version__"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
build_command = "uv build"
upload_to_vcs_release = false
upload_to_pypi = false
# uv.lock is NOT an asset: PSR runs build_command after creating the version commit, so a
# lock refreshed during the build is always too late to be committed. Release CI re-locks
# and commits engine/uv.lock explicitly after `psr version` instead.
assets = ["CHANGELOG.md"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
# Resolved from engine/ working directory (see Release workflow).
changelog_file = "CHANGELOG.md"
mask_initial_release = false
