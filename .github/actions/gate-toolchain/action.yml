name: Gate toolchain
description: >-
  Pinned CLIs plus app-service runtimes (JDK 21, .NET 10) for engine dry-run
  gate tests. Shared by CI and Release so toolchain drift cannot block tags.

inputs:
  enable-cache:
    description: Restore and save the gate toolchain between runs
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # App-service java-build / dotnet-build gates need these on every pytest run.
    # Keep them here (not only in ci.yml) so Release cannot drift and stall tags
    # that drive downstream EKS deploys.
    - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07  # v4
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
      with:
        dotnet-version: "10.0.x"

    - name: Install Maven
      shell: bash
      run: |
        set -euo pipefail
        if command -v mvn >/dev/null 2>&1; then
          mvn -version
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends maven
        mvn -version

    - name: Prepare gate toolchain paths
      shell: bash
      run: |
        set -euo pipefail
        root="${GITHUB_WORKSPACE}"
        mkdir -p "${root}/.gate-tools/bin" "${root}/.gate-tools/py-deps/bin"
        echo "${root}/.gate-tools/bin" >> "$GITHUB_PATH"
        echo "${root}/.gate-tools/py-deps/bin" >> "$GITHUB_PATH"
        {
          echo -n "PYTHONPATH=${root}/.gate-tools/py-deps"
          if [[ -n "${PYTHONPATH:-}" ]]; then
            echo -n ":${PYTHONPATH}"
          fi
          echo
        } >> "$GITHUB_ENV"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      if: inputs.enable-cache == 'true'
      id: gate-toolchain-cache
      with:
        path: |
          .gate-tools/bin
          .gate-tools/py-deps
          ~/.ansible/collections
        key: gate-toolchain-${{ runner.os }}-${{ hashFiles('deploy/local/gate-toolchain-pins.env', 'deploy/local/install-gate-toolchain.sh', 'ansible/requirements-gate-collections.yml') }}

    - name: Install gate toolchain
      if: inputs.enable-cache != 'true' || steps.gate-toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEST: ${{ github.workspace }}/.gate-tools/bin
        GATE_PIP_TARGET: ${{ github.workspace }}/.gate-tools/py-deps
        REPO_ROOT: ${{ github.workspace }}
        USE_UV_PIP: "1"
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"
        chmod +x deploy/local/install-gate-toolchain.sh
        deploy/local/install-gate-toolchain.sh

    - name: Gate toolchain cache hit
      if: inputs.enable-cache == 'true' && steps.gate-toolchain-cache.outputs.cache-hit == 'true'
      shell: bash
      run: echo "Restored gate toolchain from cache."

    - name: Verify gate toolchain pins
      shell: bash
      working-directory: engine
      run: |
        set -euo pipefail
        uv run repave doctor --strict --repo-root "${GITHUB_WORKSPACE}"
