name: Detect Helm chart CI paths
description: >-
  True when changes can affect chart render, portal image, or chart-smoke.
  Workflow runs on every PR so required checks can skip heavy steps when false.
outputs:
  chart_needed:
    description: Run chart validate/smoke when true
    value: ${{ steps.filter.outputs.chart_needed }}
  backstage_smoke_needed:
    description: Run Backstage kind smoke when true (yarn + image build)
    value: ${{ steps.filter.outputs.backstage_smoke_needed }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
      id: filter
      with:
        # Default "some": any listed path change sets chart_needed. "every" would
        # require each changed file to match all globs (impossible across trees).
        filters: |
          chart_needed:
            - 'deploy/k8s/**'
            - 'deploy/local/Dockerfile'
            - 'deploy/local/Dockerfile.corpus'
            - 'deploy/local/gate-toolchain-pins.env'
            - 'deploy/local/install-gate-toolchain.sh'
            - 'deploy/local/certs/**'
            - 'engine/pyproject.toml'
            - 'engine/uv.lock'
            - 'engine/src/**'
            - 'schemas/**'
            - 'blueprints/**'
            - 'standards/**'
            - 'policy/**'
            - 'ansible/requirements-gate-collections.yml'
            - '.github/workflows/chart.yml'
            - '.github/actions/chart-ci-paths/**'
          backstage_smoke_needed:
            - 'backstage/**'
            - 'deploy/k8s/chart/templates/backstage-*.yaml'
            - 'deploy/k8s/chart/templates/_helpers.tpl'
            - 'deploy/k8s/chart/values-backstage.yaml'
            - 'deploy/k8s/hack/chart-smoke-backstage.sh'
            - 'deploy/k8s/hack/build-backstage-bundle.sh'
            - '.github/workflows/chart.yml'
            - '.github/actions/chart-ci-paths/**'
