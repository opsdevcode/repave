    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/chart-ci-paths
        id: paths

      - name: Unrelated change (skip Backstage chart smoke)
        if: steps.paths.outputs.backstage_smoke_needed != 'true'
        run: echo "No Backstage or overlay paths; skipping Backstage kind smoke."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.paths.outputs.backstage_smoke_needed == 'true'
        with:
          node-version: "22"

      - name: Enable corepack yarn
        if: steps.paths.outputs.backstage_smoke_needed == 'true'
        run: corepack enable

      - name: Install Helm
        if: steps.paths.outputs.backstage_smoke_needed == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
