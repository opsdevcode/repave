        id: paths

      - name: Unrelated change (skip fleet snapshot chart smoke)
        if: >-
          github.event_name == 'pull_request' &&
          steps.paths.outputs.chart_needed != 'true'
        run: echo "No chart or portal image paths; skipping fleet snapshot kind smoke."

      - name: Install Helm
        if: >-
          github.event_name != 'pull_request' ||
