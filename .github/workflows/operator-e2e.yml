name: Operator e2e

on:
  schedule:
    # Nightly 06:00 UTC — full kind + Docker when PRs skipped path-gated e2e.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: operator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-e2e:
    name: operator-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/operator-e2e-paths
        id: paths

      - name: Unrelated change (skip kind e2e on PR)
        if: >-
          github.event_name == 'pull_request' &&
          steps.paths.outputs.e2e_needed != 'true'
        run: echo "No operator/engine/blueprint changes; skipping kind e2e."

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: >-
          github.event_name != 'pull_request' ||
          steps.paths.outputs.e2e_needed == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install kind
        if: >-
          github.event_name != 'pull_request' ||
          steps.paths.outputs.e2e_needed == 'true'
        run: go install sigs.k8s.io/kind@v0.27.0

      - name: Add Go bin to PATH
        if: >-
          github.event_name != 'pull_request' ||
          steps.paths.outputs.e2e_needed == 'true'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run operator e2e (kind)
        if: >-
          github.event_name != 'pull_request' ||
          steps.paths.outputs.e2e_needed == 'true'
        run: make operator-e2e
