name: Operator e2e

on:
  schedule:
    # Nightly 06:00 UTC — kind + Docker; not run on every PR.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/operator-e2e.yml"
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator-e2e.yml"

jobs:
  kind-e2e:
    name: operator-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.27.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run operator e2e (kind)
        run: make operator-e2e
