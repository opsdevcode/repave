name: Python Quality and Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-quality-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Python quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip quality and security)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping quality and security."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - name: Install engine and tools
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv sync --extra dev --extra postgres --frozen

      - name: Verify GitHub Action pins
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-action-pins.py

      - name: Verify Release shares CI gate-toolchain runtimes
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_release_test_toolchain.py

      - name: Verify blueprint conformance manifests
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: engine
        run: uv run python ../scripts/check_blueprint_conformance_manifests.py

      - name: Ruff lint
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run ruff check src tests

      - name: Ruff format
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run ruff format --check src tests

      - name: mypy
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run mypy src

      - name: Bandit (Python SAST)
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run bandit -r src -c pyproject.toml

      - name: pip-audit (dependency vulnerabilities)
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run pip-audit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: ESLint (JavaScript)
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: npm ci && npm run lint:js
