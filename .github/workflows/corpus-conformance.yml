name: Corpus conformance

on:
  pull_request:
    paths:
      - "blueprints/**"
      - "standards/**"
      - "policy/**"
      - "schemas/**"
      - "ansible/**"
      - "observability/**"
      - "engine/src/repave_engine/blueprint_conformance.py"
      - "engine/tests/test_blueprint_conformance*.py"
      - "scripts/check_blueprint_conformance_manifests.py"
  push:
    branches: [main, next/v3]
    paths:
      - "blueprints/**"
      - "standards/**"
      - "policy/**"
      - "schemas/**"
      - "ansible/**"
      - "observability/**"
  workflow_dispatch:

jobs:
  manifest-check:
    name: corpus-manifest-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install engine (conformance helpers only)
        working-directory: engine
        run: uv sync --extra dev --frozen

      - name: Verify blueprint conformance manifests
        working-directory: engine
        run: uv run python ../scripts/check_blueprint_conformance_manifests.py

  render-only:
    name: corpus-render-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install engine
        working-directory: engine
        run: uv sync --extra dev --frozen

      - name: Run render-only conformance
        working-directory: engine
        run: >-
          uv run pytest
          tests/test_blueprint_conformance.py
          tests/test_blueprint_conformance_helpers.py
          -k "not slow"
          -q
