name: Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator.yml"
  pull_request:

concurrency:
  group: operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: operator-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            operator:
              - "operator/**"
              - ".github/workflows/operator.yml"

      - name: No operator changes (skip unit/lint)
        if: steps.filter.outputs.operator != 'true'
        run: echo "No changes under operator/; skipping operator unit tests and lint."

      - uses: actions/setup-go@v5
        if: steps.filter.outputs.operator == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Cache envtest binaries
        if: steps.filter.outputs.operator == 'true'
        uses: actions/cache@v4
        with:
          path: operator/bin/k8s
          key: envtest-${{ runner.os }}-1.31.0-${{ hashFiles('operator/Makefile') }}
          restore-keys: |
            envtest-${{ runner.os }}-1.31.0-

      - name: Run tests (unit + envtest)
        if: steps.filter.outputs.operator == 'true'
        run: |
          for attempt in 1 2 3; do
            if make test; then
              exit 0
            fi
            echo "make test failed (attempt ${attempt}/3); retrying envtest download..."
            rm -rf bin/k8s
            sleep 15
          done
          exit 1

      - name: Lint
        if: steps.filter.outputs.operator == 'true'
        run: make lint

      - name: Verify generated manifests committed
        if: steps.filter.outputs.operator == 'true'
        run: |
          git diff --exit-code config/crd/bases config/rbac \
            api/v1alpha1/zz_generated.deepcopy.go api/v1beta1/zz_generated.deepcopy.go
