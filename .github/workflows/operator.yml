name: Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator.yml"
  pull_request:
  merge_group:

jobs:
  test:
    name: operator-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            operator:
              - "operator/**"
              - ".github/workflows/operator.yml"

      - name: No operator changes (skip unit/lint)
        if: steps.filter.outputs.operator != 'true'
        run: echo "No changes under operator/; skipping operator unit tests and lint."

      - uses: actions/setup-go@v5
        if: steps.filter.outputs.operator == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Run tests (unit + envtest)
        if: steps.filter.outputs.operator == 'true'
        run: make test

      - name: Lint
        if: steps.filter.outputs.operator == 'true'
        run: make lint

      - name: Verify generated manifests committed
        if: steps.filter.outputs.operator == 'true'
        run: |
          git diff --exit-code config/crd/bases config/rbac api/v1alpha1/zz_generated.deepcopy.go
