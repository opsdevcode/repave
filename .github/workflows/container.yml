name: Container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: Image to publish (all = full matrix)
        type: choice
        options:
          - all
          - engine
          - portal
          - corpus
          - operator
          - backstage
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job-level `if:` cannot reference matrix (GitHub rejects the workflow).
  # Shape the include list here so workflow_dispatch can target one image.
  matrix:
    name: Compute image matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      - id: build
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          full='[
            {"key":"engine","name":"repave-engine","ghcr_image":"opsdevcode/repave-engine","image":"ghcr.io/opsdevcode/repave-engine","context":".","file":"deploy/local/Dockerfile","build_args":"INSTALL_GATE_TOOLCHAIN=1\nINCLUDE_CORPUS=0","pre_build":"","description":"Gate-toolchain worker for repave async runs, live_plan, and bundle generation (mount repave-corpus at /app)."},
            {"key":"portal","name":"repave-engine-portal","ghcr_image":"opsdevcode/repave-engine-portal","image":"ghcr.io/opsdevcode/repave-engine-portal","context":".","file":"deploy/local/Dockerfile","build_args":"INSTALL_GATE_TOOLCHAIN=0\nINCLUDE_CORPUS=0","pre_build":"","description":"Portal and API image without gate CLIs; enqueue runs for repave-engine workers (mount repave-corpus at /app)."},
            {"key":"corpus","name":"repave-corpus","ghcr_image":"opsdevcode/repave-corpus","image":"ghcr.io/opsdevcode/repave-corpus","context":".","file":"deploy/local/Dockerfile.corpus","build_args":"","pre_build":"","description":"Versioned repave generation corpus (blueprints, standards, policy, schemas) for initContainer mounts."},
            {"key":"operator","name":"repave-operator","ghcr_image":"opsdevcode/repave-operator","image":"ghcr.io/opsdevcode/repave-operator","context":"operator","file":"operator/Dockerfile","build_args":"","pre_build":"","description":"Kubernetes operator for GoldenPathRepo drift detection and governed remediation pull requests."},
            {"key":"backstage","name":"repave-backstage","ghcr_image":"opsdevcode/repave-backstage","image":"ghcr.io/opsdevcode/repave-backstage","context":"backstage","file":"backstage/packages/backend/Dockerfile","build_args":"","pre_build":"deploy/k8s/hack/build-backstage-bundle.sh","description":"Hosted Backstage IDP UI; Scaffolder and catalog talk to the engine over /api/v2 only (ADR 011)."}
          ]'
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            target="${TARGET:-all}"
          else
            target="all"
          fi
          if [[ "$target" == "all" ]]; then
            include="$full"
          else
            include=$(echo "$full" | jq -c --arg key "$target" '[.[] | select(.key == $key)]')
            if [[ "$(echo "$include" | jq 'length')" -eq 0 ]]; then
              echo "unknown workflow_dispatch target: $target" >&2
              exit 1
            fi
          fi
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.pre_build != ''
        with:
          node-version: "22"

      - name: Pre-build image context
        if: matrix.pre_build != ''
        run: |
          chmod +x "${{ matrix.pre_build }}"
          "${{ matrix.pre_build }}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/opsdevcode/repave
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push image (retry on GHCR flake)
        env:
          CONTEXT: ${{ matrix.context }}
          FILE: ${{ matrix.file }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_ARGS: ${{ matrix.build_args }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          PUSH_ATTEMPTS: "3"
          PUSH_RETRY_WAIT_SECONDS: "45"
        run: |
          chmod +x deploy/k8s/hack/ghcr-login.sh deploy/k8s/hack/ghcr-build-push.sh
          ./deploy/k8s/hack/ghcr-build-push.sh

      - name: Verify image on GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          chmod +x deploy/k8s/hack/verify-ghcr-tag.sh
          SHA_SHORT="${GITHUB_SHA::7}"
          ./deploy/k8s/hack/verify-ghcr-tag.sh "${{ matrix.ghcr_image }}" "${SHA_SHORT}"
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            ./deploy/k8s/hack/verify-ghcr-tag.sh "${{ matrix.ghcr_image }}" "main"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ./deploy/k8s/hack/verify-ghcr-tag.sh "${{ matrix.ghcr_image }}" "${VERSION}"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
