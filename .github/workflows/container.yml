name: Container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-gate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/opsdevcode/repave-engine
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push gate-toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile
          push: true
          tags: ${{ steps.meta-gate.outputs.tags }}
          labels: ${{ steps.meta-gate.outputs.labels }}
          build-args: |
            INSTALL_GATE_TOOLCHAIN=1
            INCLUDE_CORPUS=0

      - id: meta-portal
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/opsdevcode/repave-engine-portal
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push portal-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile
          push: true
          tags: ${{ steps.meta-portal.outputs.tags }}
          labels: ${{ steps.meta-portal.outputs.labels }}
          build-args: |
            INSTALL_GATE_TOOLCHAIN=0
            INCLUDE_CORPUS=0

      - id: meta-corpus
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/opsdevcode/repave-corpus
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push corpus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile.corpus
          push: true
          tags: ${{ steps.meta-corpus.outputs.tags }}
          labels: ${{ steps.meta-corpus.outputs.labels }}
