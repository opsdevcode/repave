name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip tests)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping test suite."

      - uses: astral-sh/setup-uv@v5
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - name: Install engine
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv sync --extra dev --frozen

      - name: Install gate toolchain
        if: steps.paths.outputs.ci_needed == 'true'
        uses: ./.github/actions/gate-toolchain

      - name: Run tests
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run pytest -n auto --cov=repave_engine --cov-report=term-missing

      - name: Verify doc version pointers
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync_doc_versions.py --check
