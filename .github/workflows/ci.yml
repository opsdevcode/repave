name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip tests)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping test suite."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07  # v4
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Install engine
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv sync --extra dev --extra postgres --frozen

      - name: Install gate toolchain
        if: steps.paths.outputs.ci_needed == 'true'
        uses: ./.github/actions/gate-toolchain

      - name: Run tests
        if: steps.paths.outputs.ci_needed == 'true'
        run: uv run pytest -n auto --cov=repave_engine --cov-report=term-missing

      - name: Verify doc version pointers
        if: steps.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync_doc_versions.py --check
