name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      ci_needed: ${{ steps.paths.outputs.ci_needed }}
      blueprints: ${{ steps.paths.outputs.blueprints }}
      engine_portal: ${{ steps.paths.outputs.engine_portal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/ci-paths
        id: paths

  engine-unit:
    name: engine-unit
    needs: paths
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Docs-only change (skip tests)
        if: needs.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping engine-unit."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        if: needs.paths.outputs.ci_needed == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: needs.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - name: Install engine
        if: needs.paths.outputs.ci_needed == 'true'
        run: uv sync --extra dev --extra postgres --frozen

      - name: Install gate toolchain
        if: needs.paths.outputs.ci_needed == 'true'
        uses: ./.github/actions/gate-toolchain

      - name: Run unit shard
        if: needs.paths.outputs.ci_needed == 'true'
        run: make -C .. test-core COV=1

      - name: Verify doc and versions.lock pointers
        if: needs.paths.outputs.ci_needed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/sync_doc_versions.py --check
          python3 scripts/sync_versions_lock.py --check

  engine-portal:
    name: engine-portal
    needs: paths
    runs-on: ubuntu-latest
    if: needs.paths.outputs.ci_needed == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install engine
        run: uv sync --extra dev --extra postgres --frozen

      - name: Run portal shard
        run: make -C .. test-portal

  engine-slow:
    name: engine-slow
    needs: paths
    runs-on: ubuntu-latest
    if: needs.paths.outputs.ci_needed == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install engine
        run: uv sync --extra dev --extra postgres --frozen

      - name: Install gate toolchain
        uses: ./.github/actions/gate-toolchain

      - name: Run slow shard
        run: make -C .. test-slow

  # Ruleset on main still lists `test` until main-branch.json is applied on GitHub.
  test:
    name: test
    needs: [paths, engine-unit, engine-portal, engine-slow]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && needs.paths.result == 'success' }}
    steps:
      - name: Satisfy legacy required check
        env:
          CI_NEEDED: ${{ needs.paths.outputs.ci_needed }}
          UNIT: ${{ needs.engine-unit.result }}
          PORTAL: ${{ needs.engine-portal.result }}
          SLOW: ${{ needs.engine-slow.result }}
        run: |
          set -euo pipefail
          if [ "${CI_NEEDED}" != "true" ]; then
            echo "docs-only: legacy test check satisfied"
            exit 0
          fi
          if [ "${UNIT}" = "success" ] && [ "${PORTAL}" = "success" ] && [ "${SLOW}" = "success" ]; then
            echo "engine shards passed"
            exit 0
          fi
          echo "engine shard failure: unit=${UNIT} portal=${PORTAL} slow=${SLOW}"
          exit 1

  cli:
    name: repave-cli
    needs: paths
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Docs-only change (skip tests)
        if: needs.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping repave-cli suite."

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        if: needs.paths.outputs.ci_needed == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: needs.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - name: Install repave-cli
        if: needs.paths.outputs.ci_needed == 'true'
        run: |
          uv venv
          uv pip install -e ".[dev]" -e "../engine[server]"

      - name: Lint
        if: needs.paths.outputs.ci_needed == 'true'
        run: |
          uv run --no-project ruff check src tests
          uv run --no-project ruff format --check src tests

      - name: Typecheck
        if: needs.paths.outputs.ci_needed == 'true'
        run: uv run --no-project mypy src

      - name: Security scan
        if: needs.paths.outputs.ci_needed == 'true'
        run: |
          uv run --no-project bandit -r src -c pyproject.toml
          uv run --no-project pip-audit

      - name: Run tests
        if: needs.paths.outputs.ci_needed == 'true'
        run: uv run --no-project pytest --cov=repave_cli --cov-report=term-missing
