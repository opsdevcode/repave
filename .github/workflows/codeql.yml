name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
  - cron: "06 00 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: engine cli scripts
          - language: javascript-typescript
            paths: backstage engine/src/repave_engine/static
          - language: go
            paths: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: ${{ matrix.language }}
          paths: ${{ matrix.paths }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.language == 'go'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Build operator for CodeQL
        if: matrix.language == 'go'
        working-directory: operator
        run: go build -o /tmp/repave-operator ./cmd/main.go

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: /language:${{ matrix.language }}
