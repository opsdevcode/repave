name: Sync branch rulesets

on:
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Update main branch ruleset
        env:
          GH_TOKEN: ${{ secrets.REPAVE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RULESET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | select(.name=="main branch") | .id')"
          if [ -z "${RULESET_ID}" ]; then
            echo "No ruleset named 'main branch'; create it manually first." >&2
            exit 1
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            --input .github/rulesets/main-branch.json

      - name: Update next/v3 branch ruleset
        env:
          GH_TOKEN: ${{ secrets.REPAVE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RULESET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | select(.name=="next/v3 branch") | .id')"
          if [ -z "${RULESET_ID}" ]; then
            echo "No ruleset named 'next/v3 branch'; create it manually on GitHub first." >&2
            exit 0
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            --input .github/rulesets/next-v3-branch.json
