name: Helm chart publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart-publish:
    name: chart-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push charts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '${GITHUB_REF_NAME}' is not a semver vX.Y.Z; refusing publish" >&2
            exit 1
          fi
          chmod +x deploy/k8s/hack/publish-charts.sh
          ./deploy/k8s/hack/publish-charts.sh "${VERSION}"

      - name: Wait for GHCR image tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x deploy/k8s/hack/wait-ghcr-tags.sh
          ./deploy/k8s/hack/wait-ghcr-tags.sh "${VERSION}"

      - name: Notify repave-aws-infra
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "INFRA_DEPLOY_TOKEN is not set; cannot dispatch deploy to repave-aws-infra" >&2
            echo "Create a PAT (repo scope on opsdevcode/repave-aws-infra) as secret INFRA_DEPLOY_TOKEN." >&2
            exit 1
          fi
          SEMVER="${VERSION#v}"
          gh api repos/opsdevcode/repave-aws-infra/dispatches \
            --input - <<EOF
          {
            "event_type": "repave-release",
            "client_payload": {
              "version": "${SEMVER}",
              "tag": "v${SEMVER}",
              "sha": "${GITHUB_SHA}"
            }
          }
          EOF
          echo "Dispatched repave-release for ${SEMVER} to opsdevcode/repave-aws-infra"
